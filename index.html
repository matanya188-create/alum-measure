/* ---- יומן פעילות ---- */
function cloudActText(key, op){
  const k=key[0], id=key.slice(2);
  const projOf = pid => { const d=Cloud.projects.get(pid); return d ? cloudObj(d.d) : null; };
  if(k==="s") return {text:"עדכן את ההגדרות", where:"", pid:""};
  if(k==="r") return {text:"עדכן את התמחור", where:pname(projOf(id)||{}), pid:id};
  if(k==="p"){
    const p=projOf(id)||{}, w=p.kind==="quote"?"מדידת ההצעה":"הפרויקט";
    const t={create:(p.kind==="quote"?"פתח מדידת הצעה חדשה":"פתח פרויקט חדש"), update:"עדכן את פרטי "+w, delete:"העביר לסל המחזור את "+w, restore:"שחזר מסל המחזור את "+w}[op];
    return {text:t, where:pname(p), pid:id};
  }
  const d=Cloud.items.get(id)||{}, p=projOf(d.pid)||{};
  const it=cloudObj(d.d)||{};
  const lbl=TYPE(it.type).name+(it.location?" ב"+it.location:"");
  const t={create:"הוסיף "+lbl, update:"עדכן "+lbl, delete:"מחק "+lbl, restore:"שחזר "+lbl}[op];
  return {text:t, where:pname(p), pid:d.pid||"", v:"i."+op, ty:Number(it.type)||1, loc:String(it.location||"")};
}
function cloudActivity(key, op, data){
  if(key[0]==="i" && op==="update" && Object.keys(data).every(f=>f==="pos"||f==="pid")) return;   /* שינוי סדר — לא מעניין ביומן */
  const now=Date.now(), e=Cloud.act.get(key);
  /* עריכות של אותו דבר ב-10 הדקות הראשונות = שורה אחת ביומן (מתעדכנת), כדי שהקלדה לא תציף אותו */
  if(op==="update" && e && now-e.t0<10*60000){ e.dirty=true; cloudActFlushSoon(); return; }
  const ent={ref:Cloud.m.doc(cloudCol("activity")), key:key, op:op, t0:now, dirty:false};
  Cloud.act.set(key, ent);
  cloudActWrite(ent, true);
}
function cloudActWrite(ent, isNew){
  const M=Cloud.m, u=Cloud.user; if(!M || !u) return;
  const t=cloudActText(ent.key, ent.op), ts=M.serverTimestamp();
  const data={at:ts, by:u.email, byName:u.name, text:t.text, where:t.where||"", pid:t.pid||""};
  if(t.v){ data.v=t.v; data.ty=t.ty; data.loc=t.loc.slice(0,120); }
  if(isNew){ data.t0=ts; data.op=ent.op; }
  M.setDoc(ent.ref, data, {merge:!isNew}).catch(()=>{});
  ent.dirty=false;
}
function cloudActFlushSoon(){ if(!Cloud.actTimer) Cloud.actTimer=setTimeout(cloudActFlush, 20000); }
function cloudActFlush(){
  if(Cloud.actTimer){ clearTimeout(Cloud.actTimer); Cloud.actTimer=null; }
  Cloud.act.forEach(e=>{ if(e.dirty) cloudActWrite(e,false); });
}
function cloudLogOnce(text, where, pid){
  const M=Cloud.m, u=Cloud.user, ts=M.serverTimestamp();
  M.setDoc(M.doc(cloudCol("activity")), {at:ts, t0:ts, op:"log", by:u.email, byName:u.name, text:text, where:where||"", pid:pid||""}).catch(()=>{});
}
function cloudActivityStart(){
  if(!Cloud.ready || Cloud.role==="maker") return;
  if(Cloud.actUnsub){ renderActivityList(); return; }
  const M=Cloud.m, q=M.query(cloudCol("activity"), M.orderBy("at","desc"), M.limit(150));
  Cloud.actUnsub = M.onSnapshot(q, s=>{
    Cloud.activity = s.docs.map(d=>Object.assign({id:d.id}, d.data({serverTimestamps:"estimate"})));
    renderActivityList();
  }, e=>{ const box=document.getElementById("actbox"); if(box) box.innerHTML='<div class="card muted">'+esc(cloudErrText(e))+'</div>'; });
}
function cloudActivityStop(){ if(Cloud.actUnsub){ Cloud.actUnsub(); Cloud.actUnsub=null; } }

/* ---- שחזור מסל המחזור (מנהל/מפתח) ---- */
function cloudRestore(key){
  if(!canBoss()) return;
  const id=key.slice(2);
  if(key[0]==="p"){ if(!Cloud.projects.get(id)) return; cloudWrite(key,"restore",{}); }
  else {
    const d=Cloud.items.get(id); if(!d) return;
    const pd=Cloud.projects.get(d.pid);
    if(!pd || pd.deleted){ uiAlert("קודם צריך לשחזר את הפרויקט שהפריט שייך אליו.","שחזור"); return; }
    const p=proj(d.pid);
    cloudWrite(key,"restore",{pos:p?p.items.length:(Number(d.pos)||0)});
  }
  cloudRebuild(); cloudRender(); cloudToast("שוחזר ✓");
}

/* ---- ניהול צוות: מפתח מנהל את כולם; מנהל — רק עובדים ויצרנים ---- */
function cloudRolesICanGive(){ return Cloud.role==="dev" ? ["manager","employee","maker"] : Cloud.role==="manager" ? ["employee","maker"] : []; }
function cloudCanManage(em, role){
  if(!canBoss() || em===Cloud.user.email) return false;
  return Cloud.role==="dev" || role==="employee" || role==="maker";
}
function cloudTeamStart(){
  if(!canBoss()) return;
  if(Cloud.teamUnsub){ renderTeamList(); return; }
  Cloud.teamUnsub = Cloud.m.onSnapshot(cloudCol("members"), s=>{
    Cloud.team = s.docs.map(d=>{ const x=d.data(); return {email:d.id, role:String(x.role||""), name:String(x.name||"").slice(0,60),
        dev:x.dev?String(x.dev):"", devAt:cloudMs(x.devAt), devInfo:String(x.devInfo||"").slice(0,80)}; })
      .filter(x=>(cloudEmailOk(x.email) || cloudPhoneOk(x.email)) && ROLES[x.role]);
    const order={dev:0, manager:1, employee:2, maker:3};
    Cloud.team.sort((a,b)=>order[a.role]-order[b.role] || a.email.localeCompare(b.email));
    renderTeamList();
    if(document.getElementById("tmaplist")){ tmapList(); tmapDraw(); }
  }, e=>{ const box=document.getElementById("teambox"); if(box) box.innerHTML='<div class="muted">'+esc(cloudErrText(e))+'</div>'; });
}
function cloudTeamStop(){ if(Cloud.teamUnsub){ Cloud.teamUnsub(); Cloud.teamUnsub=null; } Cloud.team=null; }
/* merge: שינוי תפקיד לא מוחק את השם ואת המכשיר הקשור של עובד-טלפון */
function cloudSetMember(em, role, isNew, name){
  const M=Cloud.m, data={role:role, by:Cloud.user.email, at:M.serverTimestamp()};
  if(name) data.name=name;
  M.setDoc(M.doc(cloudCol("members"), em), data, {merge:true})
    .then(()=>{ cloudLogOnce((isNew?"הוסיף לצוות את ":"שינה את התפקיד של ")+cloudWho(em)+" ל"+ROLES[role], "", ""); })
    .catch(e=>uiAlert(cloudErrText(e), isNew?"הוספה נכשלה":"השינוי נכשל"));
}
let teamAddBy="mail";
function cloudTeamBy(v){ teamAddBy = v==="phone" ? "phone" : "mail"; render(); }
function cloudAddMember(){
  const sel=document.getElementById("teamRole"), role=sel?sel.value:"";
  if(cloudRolesICanGive().indexOf(role)<0){ uiAlert("אין לך הרשאה לתת את התפקיד הזה.","הוספה לצוות"); return; }
  if(teamAddBy==="phone"){
    const ni=document.getElementById("teamName"), pi=document.getElementById("teamPhone");
    const name=String(ni&&ni.value||"").trim().slice(0,60), ph=cloudPhoneNorm(pi&&pi.value);
    if(!name){ uiAlert("כתוב את שם העובד.","הוספה לצוות"); return; }
    if(!ph){ uiAlert("מספר הטלפון לא תקין.","הוספה לצוות"); return; }
    if(role!=="employee" && role!=="maker"){ uiAlert("לפי מספר טלפון אפשר להוסיף עובד או יצרן.","הוספה לצוות"); return; }
    if(Cloud.team && Cloud.team.some(x=>x.email===ph)){ uiAlert("המספר הזה כבר בצוות.","הוספה לצוות"); return; }
    cloudSetMember(ph, role, true, name);
    ni.value=""; pi.value=""; cloudToast("נוסף לצוות כ"+ROLES[role]+" ✓");
    return;
  }
  const inp=document.getElementById("teamEmail");
  const em=String(inp&&inp.value||"").trim().toLowerCase();
  if(!cloudEmailOk(em)){ uiAlert("כתובת המייל לא תקינה.","הוספה לצוות"); return; }
  if(Cloud.team && Cloud.team.some(x=>x.email===em)){ uiAlert("המייל הזה כבר בצוות. אפשר לשנות לו תפקיד ברשימה.","הוספה לצוות"); return; }
  cloudSetMember(em, role, true);
  inp.value=""; cloudToast("נוסף לצוות כ"+ROLES[role]+" ✓");
}
function cloudChangeRole(em, role){
  const cur=(Cloud.team||[]).find(x=>x.email===em);
  if(!cur || !cloudCanManage(em, cur.role) || cloudRolesICanGive().indexOf(role)<0) return;
  if(cloudPhoneOk(em) && role!=="employee" && role!=="maker") return;
  if(cur.role===role) return;
  cloudSetMember(em, role, false);
}
function cloudRemoveMember(em){
  const cur=(Cloud.team||[]).find(x=>x.email===em);
  if(!cur || !cloudCanManage(em, cur.role)) return;
  uiConfirm("להסיר את "+(cur.name||cloudWho(em))+" מהצוות? הוא לא יוכל יותר לראות או לערוך כלום.",{title:"הסרה מהצוות",ok:"הסר",danger:true}).then(ok=>{
    if(!ok) return;
    const M=Cloud.m;
    M.deleteDoc(M.doc(cloudCol("members"), em))
      .then(()=>{ cloudLogOnce("הסיר מהצוות את "+cloudWho(em), "", ""); }).catch(e=>uiAlert(cloudErrText(e),"הסרה נכשלה"));
  });
}
/* עובד-טלפון החליף טלפון: משחררים את המספר — הטלפון הבא שייכנס איתו יינעל אליו */
function cloudReleaseDevice(em){
  const cur=(Cloud.team||[]).find(x=>x.email===em);
  if(!cur || !cur.dev || !cloudPhoneOk(em) || !cloudCanManage(em, cur.role)) return;
  uiConfirm("לשחרר את המכשיר של "+(cur.name||cloudPhoneShow(em))+"? הטלפון הנוכחי יתנתק, והטלפון הבא שייכנס עם המספר "+cloudPhoneShow(em)+" יינעל אליו.",{title:"שחרור מכשיר",ok:"שחרר"}).then(ok=>{
    if(!ok) return;
    const M=Cloud.m;
    M.setDoc(M.doc(cloudCol("members"), em), {by:Cloud.user.email, at:M.serverTimestamp(), dev:null, devAt:null, devInfo:null}, {merge:true})
      .then(()=>{ cloudLogOnce("שחרר את המכשיר של "+cloudPhoneShow(em), "", ""); cloudToast("המכשיר שוחרר ✓"); })
      .catch(e=>uiAlert(cloudErrText(e),"השחרור נכשל"));
  });
}

/* ================= מיקום הצוות — המנהל רואה את העובדים והיצרן על מפה =================
   בטלפון של עובד/יצרן המיקום נשלח רק כשהאפליקציה פתוחה על המסך, ורק אחרי שאישר את הנוסח
   (אפליקציית דפדפן לא יכולה לשלוח מיקום ברקע). המנהל יכול לכבות את השיתוף לכולם בהגדרות.
   כל עוד המיקום משותף — מסומן אצלו "📍 מיקום משותף".
     locs/{מזהה}    {lat,lng,acc,at,by,day,name}  — המיקום האחרון
     trackpts/{id}  {lat,lng,acc,at,by,day}       — נקודות המסלול; נמחקות אחרי TRACK_DAYS ימים
   קריאה — רק מנהל ומפתח; כל אחד כותב רק את המיקום של עצמו, בשעת השרת (נאכף ב-firestore.rules). */
const TRACK_DAYS=7, CONSENT_KEY="alum_consent_v1";
/* cv = גרסת נוסח ההסכמה: מעלים אותה רק כשהנוסח משתנה — ואז כולם מתבקשים לאשר שוב */
const Track={watch:null, last:null, lastPt:null, err:"", asking:false, locMs:60000, ptMs:120000, ptMaxMs:600000, cv:1};
function trackCfg(){ const s=DB.settings||{}; return {on:s.trackOn!==false}; }
const trackDay = d => { d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function trackDist(a,b){ const R=6371000, k=Math.PI/180, dLa=(b.lat-a.lat)*k, dLo=(b.lng-a.lng)*k;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*k)*Math.cos(b.lat*k)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const trackIsWorker = () => Cloud.ready && (Cloud.role==="employee" || Cloud.role==="maker");
function trackShouldRun(){ return trackIsWorker() && trackCfg().on && !!navigator.geolocation && Track.err!=="denied" && consentOk(); }
/* ---- הסכמה לשיתוף מיקום (הנוסח שמתניה אישר) ----
   עובד/יצרן חייב לאשר כדי להשתמש באפליקציה: "אני מאשר/ת" או "צא מהאפליקציה".
   התשובה נשמרת בטלפון וגם בשרת עם תאריך (consents/{מזהה}) — המנהל רואה במפה מי אישר ומתי. */
function consentMine(){ try{ return (JSON.parse(localStorage.getItem(CONSENT_KEY))||{})[TEAM_ID+"|"+Cloud.user.email]||null; }catch(e){ return null; } }
function consentSaveLocal(ok){ try{ const o=JSON.parse(localStorage.getItem(CONSENT_KEY))||{}; o[TEAM_ID+"|"+Cloud.user.email]={v:Track.cv, ok:!!ok}; localStorage.setItem(CONSENT_KEY, JSON.stringify(o)); }catch(e){} }
function consentOk(){ const c=Cloud.user && consentMine(); return !!(c && c.ok && c.v===Track.cv); }
/* צריך לשאול: עובד/יצרן, השיתוף פעיל אצל המנהל, ואין אישור לנוסח הנוכחי */
function consentNeeded(){ return trackIsWorker() && trackCfg().on && !consentOk(); }
/* מתי שואלים (החלטת מתניה): פעם אחת בכניסה הראשונה, ושוב רק אחרי התנתקות וכניסה מחדש
   (או אם הנוסח השתנה, או אם לחץ "צא מהאפליקציה"). כניסות רגילות — לא שואלים. */
function consentCheck(){
  if(!consentNeeded() || Track.asking || document.querySelector(".consent-ov")) return;
  consentShow();
}
/* בהתנתקות — שוכחים את האישור בטלפון הזה, כדי שבכניסה הבאה יוצג שוב */
function consentForget(){ try{ const o=JSON.parse(localStorage.getItem(CONSENT_KEY))||{}; if(Cloud.user) delete o[TEAM_ID+"|"+Cloud.user.email]; localStorage.setItem(CONSENT_KEY, JSON.stringify(o)); }catch(e){} }
function consentShow(){
  Track.asking=true;
  const old=document.querySelector(".consent-ov"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="modal-overlay consent-ov";
  ov.innerHTML='<div class="modal consent" role="dialog" aria-modal="true">'
    +'<h3>📍 שיתוף מיקום בזמן העבודה</h3>'
    +'<div class="msg">'
    +'<p>אלום אלבז משתמשת באפליקציה כדי לתאם את העבודה בשטח.</p>'
    +'<p>כשהאפליקציה פתוחה בטלפון שלך, המיקום שלך נשלח למנהל ומוצג לו על מפה.</p>'
    +'<b>מתי המיקום משותף</b><ul>'
    +'<li>רק כשהאפליקציה פתוחה על המסך. כשהיא סגורה או שהמסך כבוי, לא נשלח כלום.</li>'
    +'<li>כל עוד המיקום משותף, יופיע אצלך הסימון "📍 מיקום משותף".</li></ul>'
    +'<b>מה נשמר</b><ul>'
    +'<li>המיקום האחרון שלך, והמסלול שלך בכל יום.</li>'
    +'<li>המיקום והמסלול נמחקים אוטומטית אחרי '+TRACK_DAYS+' ימים.</li></ul>'
    +'<p><b>מי רואה:</b> רק המנהל ומנהל האפליקציה. עובדים אחרים והיצרן לא רואים את המיקום שלך.</p>'
    +'<p><b>למה:</b> כדי לתאם את העבודה בשטח, לדעת מי קרוב לאיזה לקוח, ולהגיע אליך כשצריך.</p>'
    +'<p>אפשר לפנות למנהל בכל שאלה, ולבקש לראות מה נשמר עליך או למחוק אותו.</p>'
    +'</div>'
    +'<div class="btns"><button class="btn primary" data-m="ok">אני מאשר/ת</button><button class="btn" data-m="exit">צא מהאפליקציה</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('[data-m="ok"]').onclick=()=>{ ov.remove(); consentAnswer(true); };
  ov.querySelector('[data-m="exit"]').onclick=()=>{ ov.remove(); consentAnswer(false); };
}
function consentAnswer(ok){
  const M=Cloud.m;
  consentSaveLocal(ok);
  M.setDoc(M.doc(cloudCol("consents"), Cloud.user.email), {v:Track.cv, ok:!!ok, at:M.serverTimestamp(), by:Cloud.user.email, name:String(Cloud.user.name||"").slice(0,60)}).catch(()=>{});
  Track.asking=false;
  if(ok){ trackTick(); return; }
  consentExit();
}
/* "צא מהאפליקציה": מנסים לסגור; אם הדפדפן לא מרשה לסגור — מסך חוסם עד שמאשרים */
function consentExit(){
  trackStop();
  try{ window.close(); }catch(e){}
  setTimeout(()=>{
    if(document.querySelector(".consent-exit")) return;
    const ov=document.createElement("div"); ov.className="modal-overlay consent-ov consent-exit";
    ov.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h3>יצאת מהאפליקציה</h3>'
      +'<div class="msg">כדי להשתמש באפליקציה צריך לאשר את שיתוף המיקום בזמן העבודה. אפשר לסגור את החלון.</div>'
      +'<div class="btns"><button class="btn" data-m="back">חזרה להודעה</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('[data-m="back"]').onclick=()=>{ ov.remove(); consentShow(); };
  }, 300);
}
/* האישור נמצא בטלפון אבל חסר בשרת (נשלח בלי קליטה, או לפני שכללי השרת עודכנו) — משלימים, כדי שהמנהל יראה אותו */
function consentSync(){
  if(!trackIsWorker() || !consentOk() || Track.synced===Cloud.user.email) return;
  const M=Cloud.m, me=Cloud.user.email, ref=M.doc(cloudCol("consents"), me);
  Track.synced=me;
  M.getDoc(ref).then(s=>{
    const d=s.exists()?s.data():null;
    if(d && d.ok===true && d.v===Track.cv) return;
    return M.setDoc(ref, {v:Track.cv, ok:true, at:M.serverTimestamp(), by:me, name:String(Cloud.user.name||"").slice(0,60)});
  }).catch(()=>{ Track.synced=""; });
}
function trackTick(){
  if(consentNeeded()) consentCheck(); else consentSync();
  const run=trackShouldRun();
  if(run && Track.watch==null) trackStart();
  else if(!run && Track.watch!=null) trackStop(true);
  trackStatus();
}
function trackStart(){
  Track.err="";
  Track.watch=navigator.geolocation.watchPosition(trackPos, e=>{
    if(e && e.code===1){ Track.err="denied"; trackStop(true); } else Track.err="nofix";
    trackStatus();
  }, {enableHighAccuracy:true, maximumAge:30000, timeout:60000});
}
function trackStop(keepErr){
  if(Track.watch!=null){ try{ navigator.geolocation.clearWatch(Track.watch); }catch(e){} }
  Track.watch=null; Track.last=null; Track.lastPt=null;
  if(!keepErr) Track.err="";
  trackStatus();
}
function trackRetry(){ Track.err=""; trackTick(); }
function trackPos(p){
  if(!trackShouldRun() || !navigator.onLine || !Cloud.user) return;   /* בלי קליטה לא שולחים — אחרת שעת השרת לא תהיה שעת המדידה */
  const c=p.coords, now=Date.now();
  const pt={lat:Math.round(c.latitude*1e6)/1e6, lng:Math.round(c.longitude*1e6)/1e6, acc:Math.min(99999, Math.round(c.accuracy||0))};
  if(!isFinite(pt.lat) || !isFinite(pt.lng)) return;
  Track.err="";
  const M=Cloud.m, me=Cloud.user.email, day=trackDay(), ts=M.serverTimestamp();
  const A=Track.last;   /* המיקום האחרון: לכל היותר פעם בדקה (או כשזז הרבה) */
  if(!A || now-A.t>=Track.locMs || (trackDist(A,pt)>200 && now-A.t>=15000)){
    Track.last=Object.assign({t:now}, pt);
    M.setDoc(M.doc(cloudCol("locs"), me), {lat:pt.lat, lng:pt.lng, acc:pt.acc, at:ts, by:me, day:day, name:String(Cloud.user.name||"").slice(0,60)}).catch(()=>{});
  }
  const P=Track.lastPt;   /* נקודה במסלול: כשזז 50 מ׳ אחרי 2 דקות, או לפחות פעם ב-10 דקות */
  if(pt.acc<=250 && (!P || now-P.t>=Track.ptMaxMs || (now-P.t>=Track.ptMs && trackDist(P,pt)>50))){
    Track.lastPt=Object.assign({t:now}, pt);
    M.addDoc(cloudCol("trackpts"), {lat:pt.lat, lng:pt.lng, acc:pt.acc, at:ts, by:me, day:day}).catch(()=>{});
  }
  trackStatus();
}
function trackStatusText(){
  if(!trackIsWorker()) return "";
  if(!trackCfg().on) return "📍 שיתוף המיקום כבוי";
  if(!navigator.geolocation) return "📍 הטלפון הזה לא תומך במיקום";
  if(Track.err==="denied") return "📍 לא משותף — לא אושרה הרשאת מיקום בטלפון";
  if(!consentOk()) return "📍 ממתין לאישור שיתוף מיקום";
  if(Track.watch!=null) return "📍 המיקום שלך משותף עם המנהל עכשיו";
  return "📍 ממתין לאישור שיתוף מיקום";
}
function trackStatus(){
  const b=document.getElementById("trackBadge"); if(b) b.hidden = Track.watch==null;
  const s=document.getElementById("trackStatus"); if(s) s.textContent=trackStatusText();
  const r=document.getElementById("trackRetry"); if(r) r.hidden = Track.err!=="denied";
}
function trackBadgeHTML(){ return trackIsWorker() ? '<span id="trackBadge" class="track-badge"'+(Track.watch==null?' hidden':'')+'>📍 מיקום משותף</span>' : ''; }
/* בהגדרות של עובד/יצרן: מתי המיקום משותף (שקיפות) */
function trackWorkerCard(){
  if(!trackIsWorker()) return "";
  return '<div class="card"><label>📍 מיקום</label>'
    +'<div id="trackStatus" style="margin-top:6px;font-weight:700">'+esc(trackStatusText())+'</div>'
    +'<div class="muted" style="margin-top:4px">המנהל רואה את המיקום שלך רק כשהאפליקציה פתוחה. כשהיא סגורה או שהמסך כבוי, לא נשלח כלום.</div>'
    +'<button id="trackRetry" class="btn small" style="margin-top:8px"'+(Track.err==="denied"?'':' hidden')+' onclick="trackRetry()">נסה שוב</button>'
    +'</div>';
}
/* בהגדרות של מנהל/מפתח: הפעלה וכיבוי לכולם */
function trackSettingsCard(){
  if(!canBoss()) return "";
  const c=trackCfg();
  return '<div class="card"><label>📍 מיקום הצוות</label>'
    +'<div class="seg" style="margin-top:8px">'+segBtn(c.on,"פעיל","App.sf('trackOn',true);render()")+segBtn(!c.on,"כבוי","App.sf('trackOn',false);render()")+'</div>'
    +'<div class="muted" style="margin-top:8px">העובדים והיצרן משתפים מיקום רק כשהאפליקציה פתוחה אצלם, ורק אחרי שאישרו. המיקום והמסלול נשמרים '+TRACK_DAYS+' ימים.</div>'
    +'<div class="rowline wrap" style="margin-top:10px"><button class="btn small primary" onclick="nav(\'/map\')">🗺 פתח את מפת הצוות</button></div>'
    +'</div>';
}

/* ---- מפת הצוות (מנהל/מפתח) ---- */
const TMap={map:null, layer:null, unsub:null, unsub2:null, cons:new Map(), locs:new Map(), routeKey:"", route:null, routeInfo:"", fitted:false, purged:false, day:""};
/* 7 הימים האחרונים לבחירת מסלול: היום, אתמול, ואז תאריכים */
function tmapDays(){
  const out=[];
  for(let i=0;i<TRACK_DAYS;i++){ const d=new Date(Date.now()-i*864e5); out.push({v:trackDay(d), t: i===0?"היום": i===1?"אתמול": d.getDate()+"/"+(d.getMonth()+1)}); }
  return out;
}
const tmapDayLabel = v => (tmapDays().find(o=>o.v===v)||{t:v}).t;
function tmapSetDay(v){
  if(!tmapDays().some(o=>o.v===v)) return;
  TMap.day=v;
  if(TMap.routeKey){ const k=TMap.routeKey; TMap.routeKey=""; tmapRoute(k); }
}
function leafletLoad(){
  if(window.L && window.L.map) return Promise.resolve();
  if(leafletLoad.p) return leafletLoad.p;
  leafletLoad.p=new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="leaflet/leaflet.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="leaflet/leaflet.js";
    s.onload=()=>res(); s.onerror=()=>{ leafletLoad.p=null; rej(new Error("leaflet")); };
    document.head.appendChild(s);
  });
  return leafletLoad.p;
}
function viewTeamMap(){
  if(!tmapDays().some(o=>o.v===TMap.day)) TMap.day=trackDay();
  if(!canBoss()) return cloudTopbar("מפת הצוות","/")+'<div class="card muted">מפת הצוות זמינה למנהלים.</div>';
  const c=trackCfg();
  return cloudTopbar("מפת הצוות","/")
    +'<div class="card tmap-card"><div id="tmap" dir="ltr"></div></div>'
    +'<div class="card tm-day"><div class="rowline"><label style="margin:0">מסלול של יום</label>'
    +'<select id="tmday" class="grow" onchange="tmapSetDay(this.value)">'+tmapDays().map(o=>'<option value="'+o.v+'"'+(o.v===TMap.day?' selected':'')+'>'+esc(o.t)+'</option>').join("")+'</select></div></div>'
    +'<div id="tmaplist"></div>'
    +'<div class="muted" style="margin:4px 4px 6px">'+(c.on
        ? 'המיקום מתעדכן רק כשהאפליקציה פתוחה אצל העובד. המיקום והמסלול נשמרים '+TRACK_DAYS+' ימים.'
        : 'שיתוף המיקום כבוי — אפשר להפעיל בהגדרות.')+'</div>';
}
function afterTeamMapRender(){
  if(!canBoss()) return;
  cloudTeamStart(); tmapData(); tmapList(); tmapPurge();
  leafletLoad().then(()=>{
    const el=document.getElementById("tmap"); if(!el || el._leaflet_id) return;
    if(TMap.map){ try{ TMap.map.remove(); }catch(e){} }
    TMap.map=L.map(el).setView([31.8, 34.8], 8);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'}).addTo(TMap.map);
    TMap.layer=L.layerGroup().addTo(TMap.map); TMap.fitted=false;
    tmapDraw();
  }).catch(()=>{ const el=document.getElementById("tmap"); if(el) el.innerHTML='<div class="muted" style="padding:24px;text-align:center">המפה לא נטענה — בדוק שיש קליטה.</div>'; });
}
function tmapData(){
  if(TMap.unsub || !Cloud.ready) return;
  TMap.unsub=Cloud.m.onSnapshot(cloudCol("locs"), s=>{
    const m=new Map();
    s.forEach(d=>{ const x=d.data({serverTimestamps:"estimate"});
      if(typeof x.lat==="number" && typeof x.lng==="number" && Math.abs(x.lat)<=90 && Math.abs(x.lng)<=180 && cloudMs(x.at)>Date.now()-TRACK_DAYS*864e5)
        m.set(d.id, {lat:x.lat, lng:x.lng, acc:Math.max(0, Number(x.acc)||0), at:cloudMs(x.at), name:String(x.name||"").slice(0,60)}); });
    TMap.locs=m; tmapDraw(); tmapList();
  }, ()=>{});
  TMap.unsub2=Cloud.m.onSnapshot(cloudCol("consents"), s=>{
    const m=new Map(); s.forEach(d=>{ const x=d.data({serverTimestamps:"estimate"}); m.set(d.id, {ok:x.ok===true, v:Number(x.v)||0, at:cloudMs(x.at)}); });
    TMap.cons=m; tmapList();
  }, ()=>{});
}
function tmapStop(){
  if(TMap.unsub){ try{ TMap.unsub(); }catch(e){} TMap.unsub=null; }
  if(TMap.unsub2){ try{ TMap.unsub2(); }catch(e){} TMap.unsub2=null; }
  if(TMap.map){ try{ TMap.map.remove(); }catch(e){} TMap.map=null; }
  TMap.layer=null; TMap.route=null; TMap.routeKey=""; TMap.routeInfo=""; TMap.locs=new Map();
}
window.addEventListener("hashchange", ()=>{ if(location.hash.replace(/^#\/?/,"").split("/")[0]!=="map") tmapStop(); });
/* מי מופיע: עובדים ויצרנים מהצוות, וגם כל מי ששלח מיקום */
function tmapPeople(){
  const out=new Map();
  (Cloud.team||[]).forEach(x=>{ if(x.role==="employee"||x.role==="maker") out.set(x.email, {key:x.email, role:x.role, name:x.name||""}); });
  TMap.locs.forEach((l,k)=>{ const o=out.get(k)||{key:k, role:"", name:""}; o.loc=l; if(!o.name) o.name=l.name; out.set(k,o); });
  return [...out.values()].map(o=>Object.assign(o, {name:o.name||cloudWho(o.key)}))
    .sort((a,b)=>(b.loc?b.loc.at:0)-(a.loc?a.loc.at:0) || a.name.localeCompare(b.name));
}
const tmapAge = l => !l ? "none" : Date.now()-l.at<5*60000 ? "fresh" : Date.now()-l.at<30*60000 ? "recent" : "old";
function tmapDraw(){
  if(!TMap.map || !TMap.layer || !window.L) return;
  TMap.layer.clearLayers();
  const pts=[];
  tmapPeople().forEach(p=>{
    if(!p.loc) return;
    const l=p.loc, ll=[l.lat,l.lng];
    if(l.acc>30 && l.acc<3000) L.circle(ll, {radius:l.acc, color:"#12b2ab", weight:1, fillOpacity:.08, interactive:false}).addTo(TMap.layer);
    const ic=L.divIcon({className:"tm-ic", iconSize:[34,34], iconAnchor:[17,17],
      html:'<div class="tm-pin '+tmapAge(l)+'">'+esc(p.name.trim().charAt(0)||"?")+'</div><div class="tm-lbl">'+esc(p.name)+'</div>'});
    L.marker(ll, {icon:ic, keyboard:false}).addTo(TMap.layer).on("click", ()=>tmapFocus(p.key));
    pts.push(ll);
  });
  const R=TMap.route;
  if(R && R.length>1) L.polyline(R.map(x=>[x.lat,x.lng]), {color:"#2c4e9e", weight:4, opacity:.8}).addTo(TMap.layer);
  if(R && R.length) [R[0], R[R.length-1]].forEach((x,i)=>L.circleMarker([x.lat,x.lng], {radius:6, color:"#2c4e9e", weight:3, fillColor:i?"#2c4e9e":"#fff", fillOpacity:1}).addTo(TMap.layer));
  if(!TMap.fitted && pts.length){ TMap.fitted=true; if(pts.length===1) TMap.map.setView(pts[0], 15); else TMap.map.fitBounds(pts, {padding:[40,40], maxZoom:16}); }

function tmapRoute(key){
  if(TMap.routeKey===key){ TMap.routeKey=""; TMap.route=null; TMap.routeInfo=""; tmapDraw(); tmapList(); return; }
  const M=Cloud.m;
  TMap.routeKey=key; TMap.route=null; TMap.routeInfo="טוען מסלול…"; tmapList();
  const day=TMap.day||trackDay();
  M.getDocs(M.query(cloudCol("trackpts"), M.where("by","==",key), M.where("day","==",day))).then(s=>{
    if(TMap.routeKey!==key || (TMap.day||trackDay())!==day) return;
    const pts=[];
    s.forEach(d=>{ const x=d.data({serverTimestamps:"estimate"}); if(typeof x.lat==="number" && typeof x.lng==="number") pts.push({lat:x.lat, lng:x.lng, at:cloudMs(x.at)}); });
    pts.sort((a,b)=>a.at-b.at);
    TMap.route=pts;
    const hm=ms=>{ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
    TMap.routeInfo = pts.length ? tmapDayLabel(day)+": "+pts.length+" נקודות · "+hm(pts[0].at)+"–"+hm(pts[pts.length-1].at) : "אין מסלול ביום הזה";
    if(TMap.map && pts.length>1) TMap.map.fitBounds(pts.map(x=>[x.lat,x.lng]), {padding:[40,40], maxZoom:16});
    tmapDraw(); tmapList();
  }).catch(e=>{ TMap.routeInfo=cloudErrText(e); tmapList(); });
}
/* מחיקת מסלולים ומיקומים ישנים (מעל TRACK_DAYS ימים) — כשמנהל פותח את המפה */
function tmapPurge(){
  if(TMap.purged || !canBoss()) return; TMap.purged=true;
  const M=Cloud.m, cut=trackDay(new Date(Date.now()-(TRACK_DAYS+1)*864e5)), old=Date.now()-TRACK_DAYS*864e5-3600e3;
  M.getDocs(M.query(cloudCol("trackpts"), M.where("day","<",cut), M.limit(400)))
    .then(s=>s.forEach(d=>M.deleteDoc(d.ref).catch(()=>{}))).catch(()=>{});
  M.getDocs(cloudCol("locs"))
    .then(s=>s.forEach(d=>{ const at=cloudMs(d.data().at); if(at && at<old) M.deleteDoc(d.ref).catch(()=>{}); })).catch(()=>{});
}

function cloudRel(ms){
  if(!ms) return "";
  const s=(Date.now()-ms)/1000;
  if(s<60) return "עכשיו";
  if(s<3600) return "לפני "+Math.floor(s/60)+" דק׳";
  const d=new Date(ms), now=new Date(), y=new Date(now.getTime()-864e5);
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(d.toDateString()===now.toDateString()) return "היום "+hm;
  if(d.toDateString()===y.toDateString()) return "אתמול "+hm;
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()+" "+hm;
}

}

      if(r.key[0]==="p"){
        const p=parse(r.d.d), id=r.key.slice(2);
        let n=0; Cloud.items.forEach(di=>{ if(di.pid===id && !di.deleted) n++; });
        title=(p.kind==="quote"?"💰 ":"🏠 ")+pname(p); sub=(p.kind==="quote"?"מדידת הצעה":"פרויקט")+" · "+n+" פריטים";
      } else {
        const it=parse(r.d.d), pp=parse((Cloud.projects.get(r.d.pid)||{}).d);
        title="▫️ "+TYPE(it.type).name+(it.location?" · "+it.location:""); sub="מתוך "+pname(pp);
      }
      const days=Math.max(0, TRASH_DAYS-Math.floor((Date.now()-cloudMs(r.d.deletedAt))/864e5));
      return '<div class="card"><div class="rowline">'
        +'<div class="grow"><div class="title-md">'+esc(title)+'</div><div class="muted">'+esc(sub)+'</div>'
        +'<div class="byline">נמחק ע״י '+esc(r.d.deletedByName||r.d.deletedBy||"")+' · '+esc(cloudRel(cloudMs(r.d.deletedAt)))+' · יימחק לצמיתות בעוד '+days+' ימים</div></div>'
        +'<button class="btn small" onclick="cloudRestore(\''+esc(r.key)+'\')">↩ שחזר</button></div></div>';
    }).join("") : '<div class="card muted">סל המחזור ריק.</div>';
  }
  return cloudTopbar("סל מחזור","/settings")
    +'<div class="muted" style="margin:0 4px 12px">מה שנמחק נשמר כאן '+TRASH_DAYS+' יום, ומנהל יכול לשחזר אותו. אחרי זה הוא נמחק לצמיתות.</div>'+body;
}

      +(can ? '<select data-em="'+esc(x.email)+'" onchange="cloudChangeRole(this.dataset.em,this.value)" style="margin-top:4px">'
              +opts.map(r=>'<option value="'+r+'"'+(r===x.role?" selected":"")+'>'+ROLES[r]+'</option>').join("")+'</select>'

          +(ph && x.dev ? '<button class="btn small" data-em="'+esc(x.email)+'" onclick="cloudReleaseDevice(this.dataset.em)">שחרר מכשיר</button>' : '')

/* שחזור מגיבוי במצב צוות: מוסיף מה שחסר (גם מתוך סל המחזור), לא מוחק ולא דורס */
function cloudRestoreBackup(data){
  uiConfirm("השחזור יוסיף לצוות פרויקטים ופריטים מהקובץ שלא קיימים כרגע (כולל כאלה שבסל המחזור). שום דבר קיים לא יימחק או ישתנה.",{title:"שחזור מגיבוי",ok:"שחזר"}).then(ok=>{
    if(!ok) return;
    let np=0, ni=0;
    data.projects.forEach(bp=>{
      if(!bp || typeof bp!=="object" || !cloudIdOk(bp.id)) return;
      const its=(Array.isArray(bp.items)?bp.items:[]).filter(it=>it && typeof it==="object" && cloudIdOk(it.id));
      const cur=proj(bp.id);
      if(!cur){ bp.items=its; DB.projects.unshift(bp); np++; ni+=its.length; return; }
      its.forEach(it=>{ if(!cur.items.some(x=>x.id===it.id)){ cur.items.push(it); ni++; } });
    });
    cloudFixDupIds(); save(); render();
    uiAlert("נוספו "+np+" פרויקטים ו-"+ni+" פריטים.","שחזור מגיבוי");
  });
}
/* פריטים שהועתקו בעבר עם אותו מזהה לשני פרויקטים — מקבלים מזהה חדש לפני שעולים לענן */
function cloudFixDupIds(){
  const seen=new Set(); let fixed=0;
  DB.projects.forEach(p=>(p.items||[]).forEach(it=>{
    if(!it.id || seen.has(it.id)){ it.id=uid(); fixed++; }
    seen.add(it.id);
  }));
  if(fixed) saveLocal();
  return fixed;
}

/* ===== paywall (הדגמת תשלום) ===== */
async function sha256hex(s){
  const data = new TextEncoder().encode(String(s).trim().toUpperCase());
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function paywallLicensed(){ return !!localStorage.getItem(LICENSE_KEY); }
async function paywallTry(codeArg){
  const inp = document.getElementById("payCode");
  const code = codeArg!=null ? codeArg : (inp ? inp.value : "");
  const errEl = document.getElementById("payErr");
  if(!String(code).trim()){ if(errEl) errEl.textContent="הזן את הקוד שקיבלת."; return false; }
  let ok=false;
  try{ const h=await sha256hex(code); ok = (h===MASTER_HASH || LICENSE_HASHES.indexOf(h)>=0); }
  catch(e){ ok=false; }
  if(ok){
    localStorage.setItem(LICENSE_KEY,"1");
    const ov=document.getElementById("paywall"); if(ov) ov.remove();
    document.body.style.overflow="";
    render();
    return true;
  }
  if(errEl) errEl.textContent="הקוד לא תקין. ודא שהעתקת אותו במלואו.";
  return false;
}
window.paywallTry = paywallTry;
function showPaywall(){
  if(document.getElementById("paywall")) return;
  const ov=document.createElement("div"); ov.id="paywall"; ov.className="paywall";
  ov.innerHTML=''
    +'<div class="pw-card">'
    +'<img class="pw-logo" src="'+DEFAULT_LOGO+'" alt="אלום אלבז">'
    +'<h2>גישה מלאה — לכל החיים</h2>'
    +'<div class="pw-price">'+esc(PAYWALL.price)+' <span>₪</span></div>'
    +'<div class="pw-sub">תשלום חד-פעמי שפותח את כל האפליקציה לתמיד.</div>'
    +'<a class="pw-pay" href="'+esc(PAYWALL.paypal)+'" target="_blank" rel="noopener">שלם עכשיו ב-PayPal</a>'
    +'<div class="pw-or">— אחרי התשלום —</div>'
    +'<input id="payCode" class="pw-input" placeholder="קוד הרישיון שקיבלת" autocomplete="off" autocapitalize="characters">'
    +'<button class="pw-btn" onclick="paywallTry()">הפעל גישה</button>'
    +'<div id="payErr" class="pw-err"></div>'
    +'<div class="pw-note">הקוד יישלח אוטומטית, תוך דקות, למייל שאיתו תשלם ב-PayPal — הזן אותו למעלה. לא הגיע? בדוק בתיבת הספאם.</div>'
    +'</div>';
  document.body.appendChild(ov);
  document.body.style.overflow="hidden";
}

/* מצב בדיקה מוגן: הכתובת ...?paywall=test מציגה את המסך רק למי שמוסיף אותה,
   ומאפסת רישיון קודם כך שהבדיקה תמיד טרייה — בלי להשפיע על שאר הלקוחות. */
const payTestMode = /[?&]paywall=test/.test(location.search);
if(payTestMode){ try{ localStorage.removeItem(LICENSE_KEY); }catch(e){} }

i18nStart();
render();
if((PAYWALL.on || payTestMode) && !paywallLicensed()) showPaywall();
cloudInit();
