        const cxF=((mnx+mxx)/2-g.FX)/g.FW;
        let wgi=-1;
        if(PB.length>2){ for(let k=0;k<PB.length-1;k++){ if(cxF>=PB[k]&&cxF<PB[k+1]){ wgi=k; break; } } }
        const pL = wgi>=0 ? PB[wgi] : 0, pR = wgi>=0 ? PB[wgi+1] : 1;
        let x0f=(mnx-g.FX)/g.FW, x1f=(mxx-g.FX)/g.FW;
        let y0f=(mny-g.FY)/g.FH, y1f=(mxy-g.FY)/g.FH;
        let mrg=((x0f-pL)+(pR-x1f))/2; mrg=Math.max(0.015,Math.round(mrg*50)/50);
        x0f=pL+mrg; x1f=pR-mrg;
        const st=pts[0], en=pts[pts.length-1], diag=Math.hypot(bw,bh);
        const closed=Math.hypot(st[0]-en[0],st[1]-en[1])<0.28*diag;
        const nearCorners=cs=>{ let hitC=0;
          cs.forEach(c=>{ let d=1e9; pts.forEach(q=>{ const dd=Math.hypot(q[0]-c[0],q[1]-c[1]); if(dd<d)d=dd; });
            if(d<0.15*diag) hitC++; });
          return hitC; };
        let t;
        if(closed){
          t = nearCorners([[mnx,mny],[mxx,mny],[mnx,mxy],[mxx,mxy]])>=3 ? "rect" : "ell";
        } else {
          /* צורה פתוחה: לאיזה כיוון פתוחה (לפי הקצוות), ועגול/מרובע בקצה הסגור (לפי הפינות) */
          const openTop = st[1]<mny+bh*0.45 && en[1]<mny+bh*0.45;
          const closedY = openTop ? mxy : mny;
          const square = nearCorners([[mnx,closedY],[mxx,closedY]])>=2;
          t = openTop ? (square?"sqd":"archd") : (square?"sq":"arch");
        }
        y0f = (t==="archd"||t==="sqd") && y0f<0.1 ? 0.02 : Math.max(0.02,Math.round(y0f*20)/20);
        y1f = y1f>0.9 ? 0.98 : Math.round(y1f*20)/20;
        if(y1f-y0f<0.1) y1f=Math.min(0.98,y0f+0.1);
        sim.shapes=sim.shapes||[];
        sim.shapes.push({t:t,w:wgi,x0:x0f,x1:x1f,y0:y0f,y1:y1f});
        simSel={dir:"s",idx:sim.shapes.length-1};
        saveSim(); renderSim2D(); buildSimWindow();
      } else {
        const dx=Math.abs(p.x-startX), dy=Math.abs(p.y-startY);
        if(dx>6||dy>6){
          if(dy>=dx){ sim.vLines.push(simSnap((startX-g.FX)/g.FW)); simSel={dir:"v",idx:sim.vLines.length-1}; }
          else {
            /* קו רוחבי — רק על הכנף שבה צוירה התנועה */
            const PB=simPaneBounds(), fx=(startX-g.FX)/g.FW;
            let wgi=-1;
            if(PB.length>2){ for(let k=0;k<PB.length-1;k++){ if(fx>=PB[k]&&fx<PB[k+1]){ wgi=k; break; } } }
            sim.hLines.push({f:simSnap((startY-g.FY)/g.FH),w:wgi});
            simSel={dir:"h",idx:sim.hLines.length-1};
          }
          saveSim(); renderSim2D(); buildSimWindow();
        } else if(simSel){
          /* טאפ בצד — מנקה את הסימון האדום ומשאיר את הקו */
          simSel=null; renderSim2D();
        }
      }
    } else if(mode==="drag"){ saveSim(); }
    mode=null; dragRef=null;
  });
}

function initSim3D(canvas){

    cx2.fillStyle=grd; cx2.fillRect(0,0,16,64);

  key.shadow.mapSize.set(1024,1024); key.shadow.camera.near=1; key.shadow.camera.far=22;
  key.shadow.camera.left=-3.2; key.shadow.camera.right=3.2; key.shadow.camera.top=3.2; key.shadow.camera.bottom=-3.2; key.shadow.bias=-0.0007; scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,0.3); fill.position.set(-4,2.5,-3); scene.add(fill);
  // רצפת סטודיו לקבלת צל רך
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(24,24), new THREE.ShadowMaterial({opacity:0.26}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-1.55; ground.receiveShadow=true; scene.add(ground);
  const group=new THREE.Group(); scene.add(group);
  sim3d={renderer,scene,camera,group,rot:{x:0.15,y:-0.55},dist:5.2,needs:true};
  let drag=false,px=0,py=0,pinch=0;
  canvas.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(x){}});
  canvas.addEventListener("pointermove",e=>{ if(!drag)return; sim3d.rot.y+=(e.clientX-px)*0.01; sim3d.rot.x=Math.max(-1.2,Math.min(1.2,sim3d.rot.x+(e.clientY-py)*0.01)); px=e.clientX;py=e.clientY; sim3d.needs=true; });
  canvas.addEventListener("pointerup",()=>{drag=false;});
  canvas.addEventListener("pointercancel",()=>{drag=false;});
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); sim3d.dist=Math.max(2.6,Math.min(9,sim3d.dist+(e.deltaY>0?0.4:-0.4))); sim3d.needs=true; },{passive:false});
  canvas.addEventListener("touchmove",e=>{ if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); if(pinch) { sim3d.dist=Math.max(2.6,Math.min(9,sim3d.dist+(pinch-d)*0.012)); sim3d.needs=true; } pinch=d; e.preventDefault(); } },{passive:false});
  canvas.addEventListener("touchend",()=>{pinch=0;});
  function loop(){ if(!sim3d) return; if(sim3d.needs){ sim3d.needs=false; group.rotation.set(sim3d.rot.x,sim3d.rot.y,0); camera.position.set(0,0,sim3d.dist); camera.lookAt(0,0,0); renderer.render(scene,camera); } sim3d.raf=requestAnimationFrame(loop); }
  loop();
  return sim3d;
}

const FAM3D={
  minimal:  {face:0.055, depth:0.16, sash:0.05, bead:0.02},
  standard: {face:0.10,  depth:0.20, sash:0.075,bead:0.025},
  heavy:    {face:0.15,  depth:0.28, sash:0.11, bead:0.03},

/* --- הטכניקה של קונפיגורטור קליל, בגרסה פרוצדורלית: חתך פרופיל אמיתי שנסחף
   סביב מלבן. כל נקודת-חתך מייצרת לולאה מלבנית בהזחה שלה — פינות 45° נוצרות
   מעצמן, וחתך הפרופיל נשאר מדויק בכל מידה (בלי מתיחה ובלי morph targets). --- */
function sweepRing(contour,W,H,mat){
  const pos=[];
  const quad=(v0,v1,v2,v3)=>{ pos.push(v0[0],v0[1],v0[2],v1[0],v1[1],v1[2],v2[0],v2[1],v2[2], v0[0],v0[1],v0[2],v2[0],v2[1],v2[2],v3[0],v3[1],v3[2]); };
  for(let i=0;i<contour.length;i++){
    const a=contour[i], b=contour[(i+1)%contour.length];
    const ax=W/2-a[0], ay=H/2-a[0], bx=W/2-b[0], by=H/2-b[0], za=a[1], zb=b[1];
    quad([-ax,ay,za],[ax,ay,za],[bx,by,zb],[-bx,by,zb]);         // עליון
    quad([ax,ay,za],[ax,-ay,za],[bx,-by,zb],[bx,by,zb]);         // ימין
    quad([ax,-ay,za],[-ax,-ay,za],[-bx,-by,zb],[bx,-by,zb]);     // תחתון
    quad([-ax,-ay,za],[-ax,ay,za],[-bx,by,zb],[-bx,-by,zb]);     // שמאל
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat);
  mesh.castShadow=true; mesh.receiveShadow=true;
  return mesh;
}
/* חתך משקוף: פאה קדמית עם שיפוע, מדרגת-רובד פנימית לכנף */
function frameContour(f,D){ const d=D/2; return [
  [0,-d],[0,d],[f*0.16,d],[f*0.22,d*0.84],[f*0.84,d*0.84],[f*0.92,d*0.45],[f,d*0.36],[f,-d]
];}
/* חתך כנף: פאה עם פס-זיגוג מדורג לכיוון הזכוכית */
function sashContour(s,D){ const d=D/2; return [
  [0,-d],[0,d],[s*0.14,d],[s*0.2,d*0.78],[s*0.78,d*0.78],[s*0.88,d*0.28],[s,d*0.2],[s,-d]
];}

/* קיר טרוורטין: UV של ExtrudeGeometry = מטרים, אריח כל ~1.8מ'; רצפת פרקט: מישור פנים */

function buildSimWindow(){
  if(!sim3d) return;
  const g=sim3d.group; simDisposeGroup(g);
  const P=PROF(sim.profile)||{};
  const fam=P.style||"standard";
  const simKind=sim.kind||"window";
  /* דלת = כנפי ציר עד הרצפה; ויטרינה = הזזה עד הרצפה; חלון = לפי הפרופיל */
  const kind = (simKind==="door"||simKind==="doorfix") ? "hinge" : simKind==="vitrina" ? "slide" : (P.kind||"slide");
  const FP=FAM3D[fam]||FAM3D.standard;
  /* קנה מידה פיזי: יחידה אחת = מטר; חדר בגובה 2.80 */
  const FLOOR=-1.35, CEIL=1.45;
  const boxH=sim.box?SIM_BOX_CM/100:0;
  let wTot=(parseFloat(sim.w)||120);
  if(simKind==="doorfix") wTot+=Math.max(20,parseFloat(sim.fixW)||80);
  const Wd=Math.min(4.0,Math.max(0.5,wTot/100));
  const Hd=Math.min(2.7-boxH,Math.max(0.5,(parseFloat(sim.h)||100)/100));
  const sill = simKind==="window" ? Math.max(0.05,Math.min(0.9,(CEIL-FLOOR)-Hd-boxH-0.08)) : 0;
  const yC=FLOOR+sill+Hd/2;
  const D=FP.depth, ff=FP.face, ss=FP.sash;
  const base=new THREE.Color(colorToHex(sim.color));
  const alu=new THREE.MeshStandardMaterial({color:base.clone(),metalness:0.8,roughness:0.36,envMapIntensity:1.1});
  const aluD=new THREE.MeshStandardMaterial({color:base.clone().multiplyScalar(0.76),metalness:0.8,roughness:0.46,envMapIntensity:1.0});
  // זכוכית שקופה ומשקפת סביבה (בלי transmission, לרינדור אמין בכל מכשיר)
  const glassMat=new THREE.MeshStandardMaterial({color:0xdfeef1,transparent:true,opacity:0.22,metalness:0.5,roughness:0.05,envMapIntensity:1.5,side:THREE.DoubleSide});
  /* המכלול (משקוף+כנפיים) שקוע בעובי הקיר — הפאה הקדמית בקו 0 עם פני הקיר הפנימי */
  const win=new THREE.Group(); win.position.set(0,yC,-0.02-D/2); g.add(win);
  const box=(w,h,d,x,y,z,m)=>{ const me=new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.012,w),Math.max(0.012,h),Math.max(0.012,d)),m||alu); me.position.set(x,y,z); me.castShadow=true; me.receiveShadow=true; win.add(me); };
  // ----- חדר: קיר עם פתח במקום ובמידות האמיתיים, רצפה, ונוף בחוץ -----
  const wallMat=new THREE.MeshStandardMaterial({color:0xffffff,map:simGetWallTex(),roughness:0.9,metalness:0,envMapIntensity:0.12});
  const wShape=new THREE.Shape();
  wShape.moveTo(-4.2,FLOOR-0.01); wShape.lineTo(4.2,FLOOR-0.01); wShape.lineTo(4.2,2.5); wShape.lineTo(-4.2,2.5); wShape.closePath();
  const yB=FLOOR+sill, yT=yB+Hd+boxH;
  const hole=new THREE.Path();
  hole.moveTo(-Wd/2,yB); hole.lineTo(Wd/2,yB); hole.lineTo(Wd/2,yT); hole.lineTo(-Wd/2,yT); hole.closePath();
  wShape.holes.push(hole);
  const wall=new THREE.Mesh(new THREE.ExtrudeGeometry(wShape,{depth:0.24,bevelEnabled:false}),wallMat);
  wall.position.z=-0.26; wall.receiveShadow=true; g.add(wall);
  /* חיפוי חוץ — שליכט צבעוני; הפתח החיצוני בגובה החלון בלבד:
     ארגז התריס מוסתר בקיר ומבחוץ לא רואים אותו בכלל */
  const sShape=new THREE.Shape();
  sShape.moveTo(-4.2,FLOOR-0.01); sShape.lineTo(4.2,FLOOR-0.01); sShape.lineTo(4.2,2.5); sShape.lineTo(-4.2,2.5); sShape.closePath();
  const sHole=new THREE.Path();
  sHole.moveTo(-Wd/2,yB); sHole.lineTo(Wd/2,yB); sHole.lineTo(Wd/2,yB+Hd); sHole.lineTo(-Wd/2,yB+Hd); sHole.closePath();
  sShape.holes.push(sHole);
  const stucco=new THREE.Mesh(new THREE.ExtrudeGeometry(sShape,{depth:0.012,bevelEnabled:false}),
    new THREE.MeshStandardMaterial({color:0xffffff,map:simGetStuccoTex(),roughness:0.95,metalness:0,envMapIntensity:0.1}));
  stucco.position.z=-0.274; stucco.receiveShadow=true; g.add(stucco);
  /* סגירת עומק מעל המשקוף בצד החוץ כשיש ארגז — כדי שלא ייראה חלל בזווית */
  if(boxH>0){
    const lint=new THREE.Mesh(new THREE.BoxGeometry(Wd,boxH,0.05),wallMat);
    lint.position.set(0,yC+Hd/2+boxH/2,-0.235); lint.receiveShadow=true; g.add(lint);
  }
  /* הלבשות פנים — מסגרת שטוחה ברוחב 2 ס"מ בקו 0, מכסה את תפר ההתקנה (ס"מ על הקיר, ס"מ על המשקוף) */
  const openH=Hd+boxH;
  const hal=sweepRing([[0,0],[0,0.012],[0.02,0.012],[0.02,0]],Wd+0.02,openH+0.02,alu);
  hal.position.set(0,FLOOR+sill+openH/2,-0.02); g.add(hal);
  /* רצפת פנים: פרקט; רצפת חוץ: ריצוף טרוורטין בדוגמה צרפתית */
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,7),new THREE.MeshStandardMaterial({color:0xffffff,map:simGetFloorTex(),roughness:0.75,metalness:0,envMapIntensity:0.12}));
  floor.rotation.x=-Math.PI/2; floor.position.set(0,FLOOR-0.004,3.35); floor.receiveShadow=true; g.add(floor);
  const pav=new THREE.Mesh(new THREE.PlaneGeometry(16,3.1),new THREE.MeshStandardMaterial({color:0xffffff,map:simGetPaversTex(),roughness:0.85,metalness:0,envMapIntensity:0.1}));
  pav.rotation.x=-Math.PI/2; pav.position.set(0,FLOOR-0.006,-1.72); pav.receiveShadow=true; g.add(pav);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(17,8.5),new THREE.MeshBasicMaterial({map:simGetViewTex()}));
  back.position.set(0,0.6,-3.2); g.add(back);
  // ----- משקוף: חתך אמיתי שנסחף עם פינות 45° -----
  win.add(sweepRing(frameContour(ff,D),Wd,Hd,alu));
  // ארגז תריס בצבע הפרופיל, יושב על המשקוף בתוך הפתח
  if(boxH>0){
    box(Wd,boxH,D*1.06,0,Hd/2+boxH/2,0.01,alu);
    box(Wd,0.014,D*1.1,0,Hd/2+0.007,0.012,aluD); /* תפר תחתון */
  }
  const iW=Wd-2*ff, iH=Hd-2*ff;
  const X=f=>-iW/2+f*iW, Y=f=>iH/2-f*iH;
  // כנף עם חתך אמיתי + זכוכית + חלוקות מודבקות על הזכוכית
  const sashD=D*0.62, barw=Math.max(0.02,ss*0.5);
  function sashCell(cx,cy,w,h,z,ci){
    const sr=sweepRing(sashContour(ss,sashD),w,h,alu);
    sr.position.set(cx,cy,z); win.add(sr);
    const gl=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(0.02,w-2*ss+0.02),Math.max(0.02,h-2*ss+0.02)),glassMat);
    gl.position.set(cx,cy,z-0.01); gl.castShadow=false; gl.receiveShadow=false; win.add(gl);
    const zBar=z+sashD/2*0.78+0.012, gw=w-2*ss, gh=h-2*ss;
    sim.vLines.forEach(f=>{ const x=X(f);
      if(x>cx-gw/2+barw && x<cx+gw/2-barw) box(barw,gh,0.016,x,cy,zBar,alu); });
    sim.hLines.forEach(L=>{ const wgi=hlineWing(L);
      if(wgi>=0 && wgi!==ci) return; /* קו של כנף אחרת */
      const y=Y(hlineF(L));
      if(y>cy-gh/2+barw && y<cy+gh/2-barw) box(gw,barw,0.016,cx,y,zBar,alu); });
    /* צורות חופשיות שיושרו — קשת/מלבן/אליפסה על הזכוכית של הכנף */
    const seg3=(x0,y0,x1,y1,ext)=>{ const len=Math.hypot(x1-x0,y1-y0); if(len<0.005) return;
      const m=new THREE.Mesh(new THREE.BoxGeometry(len*(ext||1),barw,0.016),alu);
      m.position.set((x0+x1)/2,(y0+y1)/2,zBar); m.rotation.z=Math.atan2(y1-y0,x1-x0);
      m.castShadow=true; win.add(m); };
    const hb=barw/2; /* חצי עובי פס — זקפים נעצרים בפני הפסים, בלי בליטות בפינות */
    (sim.shapes||[]).forEach(s=>{
      const wgi=shapeWing(s);
      if(wgi>=0 && wgi!==ci) return;
      const x0=X(s.x0), x1=X(s.x1), yT=Y(s.y0), yB2=Y(s.y1);
      if(s.t==="rect"){
        seg3(x0,yT,x1,yT); seg3(x0,yB2,x1,yB2);
        seg3(x0,yB2+hb,x0,yT-hb); seg3(x1,yB2+hb,x1,yT-hb);
      } else if(s.t==="ell"){
        const cx2=(x0+x1)/2, cy2=(yT+yB2)/2, rx=(x1-x0)/2, ry=(yT-yB2)/2, N=16;
        for(let q=0;q<N;q++){ const a0=q/N*2*Math.PI, a1=(q+1)/N*2*Math.PI;
          seg3(cx2+rx*Math.cos(a0),cy2+ry*Math.sin(a0),cx2+rx*Math.cos(a1),cy2+ry*Math.sin(a1),1.06); }
      } else if(s.t==="sq"){
        seg3(x0,yB2,x0,yT-hb); seg3(x1,yB2,x1,yT-hb); seg3(x0,yT,x1,yT);
      } else if(s.t==="sqd"){
        seg3(x0,yT,x0,yB2+hb); seg3(x1,yT,x1,yB2+hb); seg3(x0,yB2,x1,yB2);
      } else if(s.t==="archd"){
        const rx=(x1-x0)/2, ry=Math.min(rx,(yT-yB2)*0.6), yS=yB2+ry, cx2=(x0+x1)/2, N=8;
        seg3(x0,yT,x0,yS); seg3(x1,yT,x1,yS);
        for(let q=0;q<N;q++){ const a0=Math.PI+q/N*Math.PI, a1=Math.PI+(q+1)/N*Math.PI;
          seg3(cx2+rx*Math.cos(a0),yS+ry*Math.sin(a0),cx2+rx*Math.cos(a1),yS+ry*Math.sin(a1),1.06); }
      } else {
        const rx=(x1-x0)/2, ry=Math.min(rx,(yT-yB2)*0.6), yS=yT-ry, cx2=(x0+x1)/2, N=8;
        seg3(x0,yB2,x0,yS); seg3(x1,yB2,x1,yS);
        for(let q=0;q<N;q++){ const a0=Math.PI-q/N*Math.PI, a1=Math.PI-(q+1)/N*Math.PI;
          seg3(cx2+rx*Math.cos(a0),yS+ry*Math.sin(a0),cx2+rx*Math.cos(a1),yS+ry*Math.sin(a1),1.06); }
      }
    });
  }
  const off=Math.min(0.06,D*0.22);
  const wings=simWingCount();
  /* ידית תלת-ממדית אמיתית — באותם מיקומים כמו בחזית, בגימור לפי הדגם שנבחר */
  function buildHandles3D(){
    if(!sim.handleOn || !sim.handleModel || wings===0) return;
    const hsSet=handleSetFor(sim.profile);
    let hcol=0xc6c9cd;
    if(/black/.test(sim.handleModel)) hcol=0x232426;
    else if(/white/.test(sim.handleModel)) hcol=0xf1f1ee;
    else if(/brass/.test(sim.handleModel)) hcol=0xa5824f;
    else if(hsSet===HANDLE_SETS.belgian||hsSet===HANDLE_SETS.art) hcol=0x8f7350;
    else if(hsSet===HANDLE_SETS.bauhaus||hsSet===HANDLE_SETS.bold) hcol=0x2a2b2e;
    const hmat=new THREE.MeshStandardMaterial({color:new THREE.Color(hcol),metalness:0.85,roughness:0.3,envMapIntensity:1.1});
    const hy = (simKind==="door"||simKind==="doorfix") ? Math.max(-iH/2+0.2, 1.0-sill-Hd/2) : 0;
    const mk=(hx,zFace,ori)=>{
      const add=m=>{ m.castShadow=true; win.add(m); };
      let m=new THREE.Mesh(new THREE.CylinderGeometry(0.027,0.027,0.012,18),hmat);
      m.rotation.x=Math.PI/2; m.position.set(hx,hy,zFace+0.006); add(m);
      m=new THREE.Mesh(new THREE.CylinderGeometry(0.011,0.011,0.032,14),hmat);
      m.rotation.x=Math.PI/2; m.position.set(hx,hy,zFace+0.026); add(m);
      const L=0.13, zL=zFace+0.044;
      const dx=ori==="left"?-1:ori==="right"?1:0, dy=ori==="down"?-1:0;
      m=new THREE.Mesh(new THREE.CylinderGeometry(0.0105,0.0105,L,14),hmat);
      if(dx!==0) m.rotation.z=Math.PI/2;
      m.position.set(hx+dx*L/2,hy+dy*L/2,zL); add(m);
      m=new THREE.Mesh(new THREE.SphereGeometry(0.0135,14,10),hmat);
      m.position.set(hx+dx*(L-0.006),hy+dy*(L-0.006),zL); add(m);
    };
    if(simKind==="doorfix"){
      /* ידית אחת על זקף הדלת שליד הקבוע */
      const PB=simPaneBounds(), xb=-iW/2+PB[1]*iW;
      if(sim.fixSide==="left") mk(xb+ss*0.9, sashD/2, "right");
      else mk(xb-ss*0.9, sashD/2, "left");
    } else if(kind==="slide"){
      mk(-iW/2+ss*0.5, off+sashD/2, "down");
      mk(iW/2-ss*0.5, ((wings-1)%2===0?off:-off)+sashD/2, "down");
    } else if(wings>=2){
      mk(-ss*0.9, sashD/2, "left");
      mk(ss*0.9, sashD/2, "right");
    } else {
      mk(iW/2-ss*0.9, sashD/2, "left");
    }
  }
  if(simKind==="doorfix"){
    // דלת + קבוע לצד — שני שדות ברוחבים שהוזנו, מפגש ביניהם
    const PB=simPaneBounds();
    const w1=PB[1]*iW, w2=iW-w1;
    sashCell(-iW/2+w1/2, 0, w1+0.004, iH, 0, 0);
    sashCell(iW/2-w2/2, 0, w2+0.004, iH, 0, 1);
  } else if(wings===0){
    // קבוע — זכוכית אחת, בלי קו מפגש
    sashCell(0,0,iW,iH,0,0);
  } else if(kind==="slide"){
    // כנפיים חופפות בשני מפלסי עומק + פסי מסילה
    [iH/2-ss*0.26,-iH/2+ss*0.26].forEach(yy=>box(iW,ss*0.4,0.028,0,yy,0,aluD));
    const ov=ss*0.55, pw=iW/wings;
    for(let c=0;c<wings;c++){
      let a=-iW/2+c*pw, b=a+pw;
      if(c>0) a-=ov; if(c<wings-1) b+=ov;
      sashCell((a+b)/2,0,b-a,iH,(c%2===0?off:-off),c);
    }
  } else {
    // ציר — כנפיים צמודות באותו מישור; זקפי המפגש יוצרים את הפרופיל האמצעי
    const pw=iW/wings;
    for(let c=0;c<wings;c++){
      sashCell(-iW/2+c*pw+pw/2,0,pw+(c<wings-1?0.004:0),iH,0,c);
    }
  }
  buildHandles3D();
  sim3d.needs=true;
}

/* ================= ACTIONS ================= */
const App = {
  newProject(){ this._newContainer("production","/p/"); },
  newQuote(){ this._newContainer("quote","/p/"); },
  _newContainer(kind){
    const p = {id:uid(), kind:kind, name:"", client:"", phone:"", address:"", date:todayISO(), measurer:(Cloud.ready&&Cloud.user?Cloud.user.name:""), notes:"", items:[]};
    if(kind==="quote"){ p.pricePerM2=DB.settings.pricePerM2||""; p.vatEnabled=true; p.vatRate=DB.settings.vatRate; }
    DB.projects.unshift(p); save(); nav("/p/"+p.id);
  },
  sf(k,v){ DB.settings[k]=v; save(); },
  qf(pid,k,v){ const p=proj(pid); if(!p) return; p[k]=v; save(); if(k==="vatEnabled"){ render(); } else { renderPricing(); } },
  setOverride(pid,iid,v){ const p=proj(pid); const it=p&&p.items.find(x=>x.id===iid); if(it){ it.priceOverride=v; save(); renderPricing(); } },
  convertToProduction(pid){
    const src=proj(pid); if(!src) return;
    uiConfirm("להעתיק את המדידות לפרויקט ייצור חדש? מדידת ההצעה המקורית תישאר כפי שהיא.",{title:"העתקה לייצור",ok:"העתק"}).then(ok=>{
      if(!ok) return;
      const cp=JSON.parse(JSON.stringify(src));
      cp.id=uid(); cp.kind="production";
      delete cp.pricePerM2; delete cp.vatEnabled; delete cp.vatRate;
      (cp.items||[]).forEach(it=>{ delete it.priceOverride; it.id=uid(); });
      DB.projects.unshift(cp); save(); nav("/p/"+cp.id);
    });
  },
  search(v){ searchQ=v; renderList(); },
  /* הדמיה ללקוח */
  simView(v){ simViewMode=v; render(); },
  simKind(k){
    if((sim.kind||"window")===k) return;
    sim.kind=k;
    const d={window:{w:120,h:100,wings:2},door:{w:95,h:215,wings:1},doorfix:{w:95,h:215,wings:1,fixW:80},vitrina:{w:300,h:220,wings:3}}[k];
    sim.w=d.w; sim.h=d.h; sim.wings=d.wings;
    if(d.fixW) sim.fixW=d.fixW;
    saveSim(); renderSimControls(); renderSim2D(); buildSimWindow();
  },
  simWings(n){
    sim.wings=n;
    saveSim(); renderSimControls(); renderSim2D(); buildSimWindow();
  },
  simBox(b){
    sim.box=!!b;
    saveSim(); renderSimControls(); renderSim2D(); buildSimWindow();
  },
  /* בחירת ידית להדמיה (כפתור ״בחר״ בגלריה); מחרוזת ריקה = הסרה */
  handlePick(id){
    if(id){ sim.handleModel=id; sim.handleOn=true; }
    else { sim.handleOn=false; }
    saveSim(); renderSimControls(); renderSim2D(); buildSimWindow();
  },
  /* תצוגה מוגדלת של ידית — כמו באתר קליל */
  handleView(name,id){
    const old=document.querySelector(".hview"); if(old) old.remove();
    const ov=document.createElement("div"); ov.className="hview";
    ov.innerHTML='<div class="hview-card">'
      +'<button class="hview-x" aria-label="סגירה">✕</button>'
      +'<img src="'+handleImg(id)+'" alt="'+esc(name)+'">'
      +'<div class="hview-name">ידית '+esc(name)+'</div>'
      +'<div class="hview-sub">קולקציית הידיות של קליל</div>'
      +'</div>';
    ov.addEventListener("click",e=>{ if(e.target===ov||e.target.classList.contains("hview-x")) ov.remove(); });
    document.body.appendChild(ov);
  },
  simPreset(v,h){
    sim.vLines = v ? v.split("|").map(Number) : [];
    sim.hLines = h ? h.split("|").map(x=>({f:Number(x),w:-1})) : [];
    simSel=null; saveSim(); renderSimControls(); renderSim2D(); buildSimWindow();
  },
  simFull(){
    const w=document.getElementById("sim3dwrap"); if(!w) return;
    if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
    else if(w.requestFullscreen){ w.requestFullscreen().catch(()=>{}); }
  },
  simAdd(dir){
    if(dir==="v"){ sim.vLines.push(0.5); simSel={dir:"v",idx:sim.vLines.length-1}; }
    else { sim.hLines.push({f:0.5,w:-1}); simSel={dir:"h",idx:sim.hLines.length-1}; }
    saveSim(); renderSim2D(); buildSimWindow();
  },
  /* העתקת הקו/הצורה שנבחרו לכל שאר הכנפיים — באותם גדלים וגבהים בדיוק */
  simCopySel(){
    const n=simWingCount();
    if(!simSel){ uiAlert("בחר קודם קו או צורה (לחיצה), ואז העתק.","העתקה לכנפיים"); return; }
    if(n<2){ uiAlert("אין כנפיים נוספות להעתיק אליהן.","העתקה לכנפיים"); return; }
    const r3=x=>Math.round(x*1000)/1000;
    let added=0;
    if(simSel.dir==="s"){
      const s=(sim.shapes||[])[simSel.idx]; if(!s) return;
      const w0=shapeWing(s);
      if(w0<0){ uiAlert("הצורה מתפרסת כבר על כל הרוחב.","העתקה לכנפיים"); return; }
      const PB=simPaneBounds();
      const sp0=PB[w0+1]-PB[w0];
      const rx0=(s.x0-PB[w0])/sp0, rx1=(s.x1-PB[w0])/sp0; /* יחסי בתוך הכנף — נשמר גם בכנפיים ברוחב שונה */
      for(let k=0;k<n;k++){
        if(k===w0) continue;
        const sp=PB[k+1]-PB[k];
        const nx0=r3(PB[k]+rx0*sp), nx1=r3(PB[k]+rx1*sp);
        const exists=sim.shapes.some(o=>o.t===s.t&&shapeWing(o)===k&&Math.abs(o.x0-nx0)<0.01&&Math.abs(o.x1-nx1)<0.01&&Math.abs(o.y0-s.y0)<0.01&&Math.abs(o.y1-s.y1)<0.01);
        if(!exists){ sim.shapes.push({t:s.t,w:k,x0:nx0,x1:nx1,y0:s.y0,y1:s.y1}); added++; }
      }
    } else if(simSel.dir==="h"){
      const L=sim.hLines[simSel.idx]; if(!L) return;
      const w0=hlineWing(L);
      if(w0<0){ uiAlert("הקו מתפרס כבר על כל הרוחב.","העתקה לכנפיים"); return; }
      const f=hlineF(L);
      for(let k=0;k<n;k++){
        if(k===w0) continue;
        const exists=sim.hLines.some(o=>hlineWing(o)===k&&Math.abs(hlineF(o)-f)<0.01);
        if(!exists){ sim.hLines.push({f:f,w:k}); added++; }
      }
    } else {
      const f=sim.vLines[simSel.idx]; if(f===undefined) return;
      const PB=simPaneBounds();
      let w0=0;
      for(let k=0;k<PB.length-1;k++){ if(f>=PB[k]&&f<PB[k+1]){ w0=k; break; } }
      const rel=(f-PB[w0])/(PB[w0+1]-PB[w0]);
      for(let k=0;k<n;k++){
        if(k===w0) continue;
        const nf=r3(PB[k]+rel*(PB[k+1]-PB[k]));

        const exists=sim.vLines.some(o=>Math.abs(o-nf)<0.01);
        if(!exists){ sim.vLines.push(nf); added++; }
      }
    }

   כל הצוות עובד על אותם פרויקטים. העותק בטלפון (localStorage) נשאר כמראה:

   תפקידים (נאכפים בכללי השרת — firestore.rules; כאן רק מה שמוצג):
     dev      = מפתח: הכל, כולל ניהול כל הצוות
     manager  = מנהל: הכל, כולל מחירים, מחיקה, שליחה ליצרן, וניהול עובדים ויצרנים בלבד
     employee = עובד: רואה ועורך את כל הפרויקטים והמדידות — בלי מחירים; מוחק רק פריטים שהוא הוסיף

   מבנה בענן (teams/{TEAM_ID}/...):
     members/{email}   {role, by, at}
     members/{+972…}   {role, by, at, name, dev, devAt, devInfo}  — עובד לפי מספר טלפון; dev = המכשיר שקשור אליו
     devices/{uid}     {phone, team, at}   (ברמה העליונה) — מכשיר בכניסה אנונימית ← המספר שלו
     projects/{id}     {d: JSON פרטי הפרויקט בלי מחירים, ...מטא}
     items/{id}        {pid, pos, d: JSON הפריט בלי תמונה ומחיר, photo, ...מטא}
     prices/{pid}      {d: JSON מחירי הפרויקט ומחירים ידניים לפריטים}          — מנהל ומפתח בלבד
     meta/settings     {d, logo}  ·  meta/pricing {d: מחירי ברירת מחדל}         — pricing: מנהל ומפתח בלבד
     production/{pid}  {d: עותק קבוע של קובץ הייצור, sentAt, sentBy, ver}       — מה שהיצרן רואה

   מטא בכל מסמך: cb/cn/ca = נוצר ע"י/שם/מתי, ub/un/ua = עודכן ע"י/שם/מתי, deleted (+deletedAt/By).
   מחיקה = סל מחזור; מחיקה סופית רק אחרי TRASH_DAYS (נאכף בשרת, כולל תאריך המחיקה עצמו).

/* ---- המרה בין DB למסמכי ענן ---- */
function cloudOmit(o, skip){ const r={}; for(const k in o){ if(skip.indexOf(k)<0) r[k]=o[k]; } return r; }
function cloudSerProject(p){ return {d:JSON.stringify(cloudOmit(p, ["items","_m","_rv"].concat(PRICE_P)))}; }
function cloudSerItem(it,pid,pos){ return {d:JSON.stringify(cloudOmit(it, ["photo","_m","priceOverride"])), photo:it.photo||null, pid:pid, pos:pos}; }
function cloudSerPrices(p){
  const o={}; PRICE_P.forEach(k=>{ if(p[k]!==undefined) o[k]=p[k]; });
  const ov={}; (p.items||[]).forEach(it=>{ if(it.priceOverride!==undefined && it.priceOverride!==null && String(it.priceOverride).trim()!=="") ov[it.id]=it.priceOverride; });
  if(Object.keys(ov).length) o.items=ov;
  return {d:JSON.stringify(o)};
}
function cloudSerSettings(s){ return {d:JSON.stringify(cloudOmit(s, ["logo"].concat(PRICE_S))), logo:s.logo||null}; }
function cloudSerPricing(s){ const o={}; PRICE_S.forEach(k=>{ if(s[k]!==undefined) o[k]=s[k]; }); return {d:JSON.stringify(o)}; }
function cloudLocalMap(){
  const m=new Map(), boss=cloudIsBoss();
  if(Cloud.role==="maker") return m;
  DB.projects.forEach(p=>{
    m.set("p:"+p.id, cloudSerProject(p));
    if(boss){ const r=cloudSerPrices(p); if(r.d!=="{}" || Cloud.last.has("r:"+p.id)) m.set("r:"+p.id, r); }
    (p.items||[]).forEach((it,i)=>m.set("i:"+it.id, cloudSerItem(it,p.id,i)));
  });
  if(boss){ m.set("s:main", cloudSerSettings(DB.settings||{})); m.set("s:pricing", cloudSerPricing(DB.settings||{})); }
  return m;
}
function cloudLastOf(key,d){
  const k=key[0];
  const o = k==="i" ? {d:d.d, photo:d.photo||null, pid:d.pid, pos:d.pos} : key==="s:main" ? {d:d.d, logo:d.logo||null} : {d:d.d};
  o.del=!!d.deleted; return o;
}
function cloudRef(key){
  const M=Cloud.m, id=key.slice(2);
  if(key[0]==="p") return M.doc(Cloud.db,"teams",TEAM_ID,"projects",id);
  if(key[0]==="i") return M.doc(Cloud.db,"teams",TEAM_ID,"items",id);
  if(key[0]==="r") return M.doc(Cloud.db,"teams",TEAM_ID,"prices",id);
  return M.doc(Cloud.db,"teams",TEAM_ID,"meta", key==="s:pricing" ? "pricing" : "settings");
}
function cloudMapOf(key){ return key[0]==="p" ? Cloud.projects : key[0]==="i" ? Cloud.items : key[0]==="r" ? Cloud.prices : null; }
const cloudCol = n => Cloud.m.collection(Cloud.db,"teams",TEAM_ID,n);
const cloudMs = t => !t ? 0 : typeof t==="number" ? t : (t.toMillis ? t.toMillis() : (t.seconds ? t.seconds*1000 : 0));
/* uid() מתחיל בזמן היצירה (base36) — כך ממיינים פרויקטים מהחדש לישן, כמו ברשימה המקומית */
const cloudCreated = id => { const n=parseInt(String(id).slice(0,8),36); return isFinite(n)?n:0; };
/* פענוח JSON מהענן: רק אובייקט רגיל נחשב תקין — רשימה, null או טקסט שבור מחזירים null */
function cloudObj(s){ try{ const o=JSON.parse(s); return (o && typeof o==="object" && !Array.isArray(o)) ? o : null; }catch(e){ return null; } }
const cloudIdOk = id => /^[a-z0-9]{6,40}$/.test(String(id));
/* תמונה/לוגו מהענן מוצגים רק אם הם באמת תמונה מקודדת — כל דבר אחר נזרק */
const cloudImgOk = s => typeof s==="string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s);
const cloudMeta = d => ({cb:d.cb||"", cn:d.cn||"", ca:cloudMs(d.ca), un:d.un||"", ub:d.ub||"", ua:cloudMs(d.ua)});
const cloudEmailOk = em => /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(String(em));

/* ---- עובד לפי מספר טלפון (בלי אימות SMS) ----
   המנהל מוסיף מספר + שם. העובד מקליד את המספר פעם אחת בטלפון שלו, והטלפון "תופס" אותו:
   כניסה אנונימית של Firebase נותנת לכל מכשיר מזהה קבוע, והשרת (firestore.rules) מקשר מספר אחד למכשיר אחד.
   מכשיר נוסף עם אותו מספר נדחה בשרת — עד שמנהל לוחץ "שחרר מכשיר", או שהעובד מתנתק בטלפון שלו. */
const cloudPhoneOk = s => /^\+[0-9]{8,15}$/.test(String(s));
function cloudPhoneNorm(s){
  let d=String(s||"").replace(/[\s\-().]/g,"");
  if(/^00\d+$/.test(d)) d="+"+d.slice(2);
  if(/^0\d{8,9}$/.test(d)) d="+972"+d.slice(1);
  else if(/^972\d{8,9}$/.test(d)) d="+"+d;
  return cloudPhoneOk(d) ? d : "";
}
function cloudPhoneShow(p){
  const m=/^\+972(\d{2})(\d{3})(\d{4})$/.exec(p) || /^\+972(\d)(\d{3})(\d{4})$/.exec(p);
  return m ? "0"+m[1]+"-"+m[2]+m[3] : String(p||"");
}
const cloudWho = k => cloudPhoneOk(k) ? cloudPhoneShow(k) : String(k||"");
/* מספר בתוך טקסט עברי: מבודד משמאל לימין ולא נשבר באמצע */
const cloudPhoneHTML = k => '<bdi dir="ltr" style="white-space:nowrap">'+esc(cloudWho(k))+'</bdi>';
function cloudDevInfo(){
  const ua=navigator.userAgent||"";
  const os=/iPhone/.test(ua)?"iPhone":/iPad/.test(ua)?"iPad":/Android/.test(ua)?"Android":/Windows/.test(ua)?"Windows":/Mac OS X/.test(ua)?"Mac":"";
  const br=/SamsungBrowser/.test(ua)?"Samsung Internet":/EdgA?\//.test(ua)?"Edge":/CriOS|Chrome\//.test(ua)?"Chrome":/FxiOS|Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"";
  let app=false; try{ app=(window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true; }catch(e){}
  return [os, br, app?"PWA":""].filter(Boolean).join(" · ").slice(0,80);
}
const CLOUD_DEV_KEY="alum_dev_v1";   /* בטלפון של עובד-טלפון: {uid, phone, name} — לפתיחה בלי קליטה */
function cloudDevLocal(){ try{ return JSON.parse(localStorage.getItem(CLOUD_DEV_KEY))||null; }catch(e){ return null; } }
function cloudDevSave(o){ try{ if(o) localStorage.setItem(CLOUD_DEV_KEY, JSON.stringify(o)); else localStorage.removeItem(CLOUD_DEV_KEY); }catch(e){} }
const cloudTimeout = (pr, ms) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej({code:"deadline-exceeded"}), ms))]);

/* ---- אתחול ---- */
async function cloudInit(){
  if(!cloudConfigured()) return;
  cloudSetState("loading");
  try{
    const mods = await Promise.all([import("./fb/firebase-app.js"), import("./fb/firebase-auth.js"), import("./fb/firebase-firestore.js")]);
    Cloud.m = Object.assign({}, mods[0], mods[1], mods[2]);
  }catch(e){ Cloud.err="רכיב הסנכרון לא נטען"; cloudSetState(navigator.onLine?"error":"offline"); return; }
  const M=Cloud.m;
  const cfg = CLOUD_EMU ? {apiKey:"demo-key", authDomain:"localhost", projectId:"demo-alum", appId:"demo"} : FB_CONFIG;
  const app = M.initializeApp(cfg);
  Cloud.auth = M.getAuth(app);
  try{ Cloud.db = M.initializeFirestore(app, {ignoreUndefinedProperties:true, localCache:M.persistentLocalCache({tabManager:M.persistentMultipleTabManager()})}); }
  catch(e){ Cloud.db = M.getFirestore(app); }
  if(CLOUD_EMU){
    M.connectAuthEmulator(Cloud.auth, "http://127.0.0.1:9099", {disableWarnings:true});
    M.connectFirestoreEmulator(Cloud.db, "127.0.0.1", 8085);
    window.__Cloud = Cloud;
    window.__cloudTestSignIn = (email,name) => M.signInWithCredential(Cloud.auth,
      M.GoogleAuthProvider.credential(JSON.stringify({sub:"u-"+email, email:email, email_verified:true, name:name})));
  }
  M.getRedirectResult(Cloud.auth).catch(e=>{ Cloud.err=cloudErrText(e); });
  M.onAuthStateChanged(Cloud.auth, u=>{ if(u) cloudSignedIn(u); else cloudSignedOut(); });
  window.addEventListener("online", ()=>{ if(Cloud.state==="offline" && Cloud.auth.currentUser) cloudSignedIn(Cloud.auth.currentUser); cloudPill(); });
  window.addEventListener("offline", cloudPill);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") cloudActFlush(); });
}

async function cloudSignedIn(u){
  if(u.isAnonymous) return cloudDevSignedIn(u);
  /* מזהה המשתמש בצוות: המייל (גוגל), ובעתיד גם מספר טלפון מאומת — כמו בכללי השרת */
  Cloud.user = {uid:u.uid, email:String(u.email||u.phoneNumber||"").toLowerCase(), name:u.displayName || (u.email ? String(u.email).split("@")[0] : String(u.phoneNumber||""))};
  const f=cloudFlag();
  Cloud.role = f.role||"";
  cloudSetState("loading");
  const M=Cloud.m, mref=M.doc(Cloud.db,"teams",TEAM_ID,"members",Cloud.user.email);
  let role="";
  try{
    const s=await M.getDoc(mref);
    if(s.exists()) role=String(s.data().role||"");
  }catch(e){
    if(e.code==="unavailable"){ if(f.role) role=f.role; else { cloudSetState("offline"); return; } }
    else if(e.code!=="permission-denied"){ Cloud.err=cloudErrText(e); cloudSetState("error"); return; }
  }
  if(!role){
    /* לא ברשימה. אם הצוות עוד לא הוקם — ניסיון הקמה; כללי השרת מתירים זאת רק לבעל האפליקציה */
    try{ await M.setDoc(M.doc(Cloud.db,"teams",TEAM_ID), {owner:Cloud.user.email, name:"אלום אלבז", createdAt:M.serverTimestamp()}); }catch(e){}
    try{ await M.setDoc(mref, {role:"dev", by:Cloud.user.email, at:M.serverTimestamp()}); role="dev"; }
    catch(e){ Cloud.role=""; cloudSetFlag({member:false, role:""}); cloudSetState("denied"); return; }
  }
  if(!ROLES[role]){ Cloud.role=""; cloudSetState("denied"); return; }
  cloudEnter(role);
}
/* חבר צוות מאושר: תפקיד, העלאה ראשונה של מה שבטלפון, והאזנה לענן */
function cloudEnter(role){
  Cloud.role=role;
  cloudSetFlag({member:true, role:role});
  if(role==="maker"){ cloudStart(); return; }   /* יצרן לא מעלה כלום — קריאה בלבד */
  if(!cloudFlag().migrated){
    const n=DB.projects.length;
    if(n>0){ cloudSetState("migrate"); cloudAskMigrate(n); return; }
    cloudSetFlag({migrated:true});
  }
  cloudStart();
}

/* טלפון של עובד לפי מספר: המספר נקרא ממסמך המכשיר בשרת, ותפקיד ניתן רק כל עוד
   הטלפון הזה הוא שקשור כרגע למספר (אחרת — מנהל שחרר אותו או הסיר את המספר) */
async function cloudDevSignedIn(u){
  if(Cloud.claiming || !u) return;
  const M=Cloud.m, loc=cloudDevLocal();
  cloudSetState("loading");
  let phone="", mem=null;
  try{
    const ds=await M.getDoc(M.doc(Cloud.db,"devices",u.uid));
    if(ds.exists()) phone=String(ds.data().phone||"");
    if(cloudPhoneOk(phone)){ const ms=await M.getDoc(M.doc(Cloud.db,"teams",TEAM_ID,"members",phone)); if(ms.exists()) mem=ms.data(); }
  }catch(e){
    if(e.code==="unavailable"){
      if(!(loc && loc.uid===u.uid && cloudPhoneOk(loc.phone))){ cloudSetState("offline"); return; }
      phone=loc.phone;
      const r=(cloudFlags()[TEAM_ID+"|"+phone]||{}).role||"";
      if(!r){ cloudSetState("offline"); return; }
      mem={role:r, name:loc.name, dev:u.uid};
    } else if(e.code!=="permission-denied"){ Cloud.err=cloudErrText(e); cloudSetState("error"); return; }
  }
  if(!cloudPhoneOk(phone)){ cloudDevSave(null); try{ await M.signOut(Cloud.auth); }catch(e){} return; }
  const name=String((mem&&mem.name)||(loc&&loc.phone===phone&&loc.name)||cloudPhoneShow(phone)).slice(0,60);
  Cloud.user={uid:u.uid, email:phone, name:name, phone:true};
  const role=String((mem&&mem.role)||"");
  if(!mem || mem.dev!==u.uid || (role!=="employee" && role!=="maker")){
    Cloud.role=""; cloudSetFlag({member:false, role:""}); cloudSetState("denied"); return;
  }
  cloudDevSave({uid:u.uid, phone:phone, name:name});
  cloudEnter(role);
}
/* כניסה ראשונה עם מספר: הטלפון תופס את המספר (שתי כתיבות באותה פעולה — השרת מאשר רק אם המספר פנוי) */
async function cloudPhoneClaim(raw){
  const M=Cloud.m, phone=cloudPhoneNorm(raw);
  if(!phone) throw {code:"bad-phone"};
  if(!navigator.onLine) throw {code:"unavailable"};
  Cloud.claiming=true;
  try{
    let u=Cloud.auth.currentUser;
    if(u && !u.isAnonymous){ await M.signOut(Cloud.auth); u=null; }
    if(!u) u=(await M.signInAnonymously(Cloud.auth)).user;
    const b=M.writeBatch(Cloud.db);
    b.set(M.doc(Cloud.db,"devices",u.uid), {phone:phone, team:TEAM_ID, at:M.serverTimestamp()});
    b.update(M.doc(Cloud.db,"teams",TEAM_ID,"members",phone), {dev:u.uid, devAt:M.serverTimestamp(), devInfo:cloudDevInfo()});
    await cloudTimeout(b.commit(), 15000);
    cloudDevSave({uid:u.uid, phone:phone, name:""});
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }catch(e){
    const u=Cloud.auth.currentUser;
    if(u && u.isAnonymous){ try{ await u.delete(); }catch(e2){ try{ await M.signOut(Cloud.auth); }catch(e3){} } }
    throw e;
  }finally{ Cloud.claiming=false; }
  await cloudDevSignedIn(Cloud.auth.currentUser);
  /* ביומן הפעילות: המנהל רואה מיד שמספר נתפס, ומאיזה מכשיר (אין אימות SMS — זו הדרך לשים לב לתפיסה לא צפויה) */
  if(Cloud.user && Cloud.user.phone && Cloud.role==="employee") cloudLogOnce(["התחבר מטלפון חדש", cloudDevInfo()].filter(Boolean).join(" · "), "", "");
}
function cloudPhoneSignIn(){
  if(!Cloud.m){ uiAlert("רכיב הסנכרון עוד לא נטען. בדוק שיש קליטה ונסה שוב.","התחברות"); return; }
  const ios=/iPhone|iPad/.test(navigator.userAgent||"") && navigator.standalone!==true;
  uiAsk({title:"כניסה עם מספר טלפון", type:"tel", placeholder:"050-1234567", ok:"היכנס",
    msg:"הקלד את מספר הטלפון שהמנהל הוסיף לצוות. המספר יינעל לטלפון הזה, ואי אפשר יהיה להיכנס איתו ממכשיר אחר.",
    note:ios?"באייפון: קודם מתקינים את האפליקציה למסך הבית, ונכנסים מתוכה.":""}).then(v=>{
    if(v==null) return;
    cloudPhoneClaim(v).catch(e=>{
      const c=(e&&e.code)||"", T="כניסה עם מספר טלפון";
      if(c==="bad-phone") uiAlert("מספר הטלפון לא תקין.",T);
      else if(c==="unavailable" || c==="deadline-exceeded" || c==="auth/network-request-failed") uiAlert("אין חיבור לאינטרנט. הכניסה הראשונה צריכה קליטה.",T);
      else if(c==="auth/operation-not-allowed" || c==="auth/admin-restricted-operation") uiAlert("כניסה עם מספר טלפון עוד לא הופעלה בשרת. המפתח צריך להפעיל אותה ב-Firebase.",T);
      else uiAlert("אי אפשר להיכנס עם המספר הזה: הוא לא נוסף לצוות, או שהוא כבר מחובר בטלפון אחר. פנה למנהל.",T);
    });
  });
}
/* התנתקות של עובד-טלפון: משחררת את המספר (צריך קליטה — אחרת המספר נשאר נעול לטלפון הזה) */
async function cloudDevRelease(){
  const M=Cloud.m, u=Cloud.auth.currentUser, phone=Cloud.user&&Cloud.user.email;
  if(!u || !u.isAnonymous) return;
  if(!navigator.onLine){ uiAlert("צריך קליטה כדי להתנתק — אחרת המספר יישאר נעול לטלפון הזה.","התנתקות"); return; }
  cloudActFlush();
  try{
    const b=M.writeBatch(Cloud.db);
    if(cloudPhoneOk(phone)) b.update(M.doc(Cloud.db,"teams",TEAM_ID,"members",phone), {dev:null, devAt:null, devInfo:null});
    b.delete(M.doc(Cloud.db,"devices",u.uid));
    await cloudTimeout(b.commit(), 15000);
  }catch(e){
    if(!(e && (e.code==="permission-denied" || e.code==="not-found"))){ uiAlert(cloudErrText(e),"התנתקות נכשלה"); return; }
  }
  consentForget();
  cloudDevSave(null);
  try{ await u.delete(); }catch(e){ try{ await M.signOut(Cloud.auth); }catch(e2){} }
}

function cloudSignedOut(){
  trackStop(); tmapStop(); cloudStop(); cloudActivityStop(); cloudTeamStop();
  Cloud.user=null; Cloud.ready=false; Cloud.role="";
  cloudSetState("signedout");
}

/* ---- כניסה / יציאה ---- */
async function cloudSignIn(){
  const M=Cloud.m;
  if(!M){ uiAlert("רכיב הסנכרון עוד לא נטען. בדוק שיש קליטה ונסה שוב.","התחברות"); return; }
  const prov=new M.GoogleAuthProvider();
  prov.setCustomParameters({prompt:"select_account"});
  try{ await M.signInWithPopup(Cloud.auth, prov); }
  catch(e){
    if(e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment"){
      try{ await M.signInWithRedirect(Cloud.auth, prov); }catch(e2){ uiAlert(cloudErrText(e2),"התחברות נכשלה"); }
    } else if(e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request"){
      uiAlert(cloudErrText(e),"התחברות נכשלה");
    }
  }
}
function cloudSignOut(){
  if(Cloud.user && Cloud.user.phone){
    uiConfirm("להתנתק? המספר "+cloudPhoneShow(Cloud.user.email)+" ישתחרר מהטלפון הזה, ואפשר יהיה להיכנס איתו בטלפון אחר. מה שבטלפון יישאר.",{title:"התנתקות",ok:"התנתק"}).then(ok=>{ if(ok) cloudDevRelease(); });
    return;
  }
  uiConfirm("להתנתק מהצוות? מה שבטלפון יישאר, אבל לא יסונכרן עד שתתחבר שוב.",{title:"התנתקות",ok:"התנתק"}).then(ok=>{
    if(ok){ cloudActFlush(); consentForget(); Cloud.m.signOut(Cloud.auth); }
  });
}
function cloudSwitchUser(){ cloudDevSave(null); consentForget(); Cloud.m.signOut(Cloud.auth).then(()=>cloudSignIn()); }

/* ---- העלאה ראשונה של הפרויקטים שבטלפון ---- */
function cloudAskMigrate(n){
  uiDialog({title:"העלאת הפרויקטים לצוות",
    msg:"בטלפון הזה יש "+n+" פרויקטים ומדידות. כדי שכל הצוות יראה אותם, הם יועלו עכשיו לענן המשותף.\n\nלפני ההעלאה יישמר קובץ גיבוי בטלפון, ליתר ביטחון. שום דבר לא נמחק.",
    ok:"גבה והעלה לצוות", cancel:"לא עכשיו"}).then(ok=>{
    if(ok){ try{ App.backup(); }catch(e){} cloudMigrate(); }
    else if(Cloud.user && Cloud.user.phone) cloudDevRelease();
    else Cloud.m.signOut(Cloud.auth);
  });
}
async function cloudMigrate(){
  cloudSetState("migrating");
  cloudFixDupIds();
  const M=Cloud.m, have=new Set(), boss=cloudIsBoss();
  let sHave=false, qHave=false;
  try{ (await M.getDocs(cloudCol("projects"))).forEach(d=>have.add(d.id)); }catch(e){}
  if(boss){
    try{ sHave=(await M.getDoc(cloudRef("s:main"))).exists(); }catch(e){}
    try{ qHave=(await M.getDoc(cloudRef("s:pricing"))).exists(); }catch(e){}
  }
  const local=cloudLocalMap();
  let np=0;
  DB.projects.forEach(p=>{
    if(have.has(p.id)) return;
    np++;
    cloudWrite("p:"+p.id, "create", local.get("p:"+p.id), true);
    if(local.has("r:"+p.id)) cloudWrite("r:"+p.id, "create", local.get("r:"+p.id), true);
    (p.items||[]).forEach(it=>cloudWrite("i:"+it.id, "create", local.get("i:"+it.id), true));
  });
  if(boss && !sHave) cloudWrite("s:main", "create", local.get("s:main"), true);
  if(boss && !qHave) cloudWrite("s:pricing", "create", local.get("s:pricing"), true);
  if(np) cloudLogOnce("העלה "+np+" "+(np===1?"פרויקט":"פרויקטים")+" מהטלפון שלו לצוות", "", "");
  cloudSetFlag({migrated:true});
  cloudStart();
}

/* ---- האזנה לענן (לפי תפקיד) ---- */
function cloudStart(){
  cloudStop();
  const M=Cloud.m, r=Cloud.role, boss=cloudIsBoss();
  Cloud.projects=new Map(); Cloud.items=new Map(); Cloud.prices=new Map(); Cloud.settings=null; Cloud.pricing=null; Cloud.production=new Map();
  Cloud.got={}; Cloud.snapPend={}; Cloud.ready=false;
  Cloud.last = new Map();
  Cloud.last = cloudLocalMap();          /* עד שהענן מוכן: "מה ידוע" = מצב הפתיחה המקומי — כך שינויים שנעשו בינתיים יזוהו ויועלו */
  Cloud.need = r==="maker" ? ["s","x","me"] : boss ? ["p","i","r","s","q","x","me"] : ["p","i","s","x","me"];
  cloudSetState("syncing");
  const opt={includeMetadataChanges:true}, onErr=e=>cloudListenErr(e), L=(q,f)=>Cloud.unsubs.push(M.onSnapshot(q,opt,f,onErr));
  if(r!=="maker"){
    L(cloudCol("projects"), s=>cloudSnap("p",s));
    L(cloudCol("items"), s=>cloudSnap("i",s));
  }
  if(boss){
    L(cloudCol("prices"), s=>cloudSnap("r",s));
    L(cloudRef("s:pricing"), s=>cloudSnapDoc("q",s));
  }
  L(cloudRef("s:main"), s=>cloudSnapDoc("s",s));
  L(cloudCol("production"), s=>cloudSnapProd(s));
  L(M.doc(Cloud.db,"teams",TEAM_ID,"members",Cloud.user.email), s=>cloudSnapMe(s));
}
function cloudStop(){ Cloud.unsubs.forEach(f=>{ try{ f(); }catch(e){} }); Cloud.unsubs=[]; cloudProdPhotosStop(); }

function cloudSnap(kind, s){
  const map = kind==="p" ? Cloud.projects : kind==="i" ? Cloud.items : Cloud.prices;
  Cloud.snapPend[kind]=s.metadata.hasPendingWrites;
  /* מטמון ריק בזמן שיש נתונים בטלפון (למשל אחרי ניקוי נתוני דפדפן) — לא בונים מזה כלום; מחכים לשרת */
  if(!Cloud.got[kind] && kind!=="r" && s.metadata.fromCache && s.empty && DB.projects.length){ cloudPill(); return; }
  const changes=s.docChanges();
  if(Cloud.got[kind] && !changes.length){ cloudPill(); return; }
  if(Cloud.ready) cloudPush();
  let ext=false, who="", rvMsg="";
  changes.forEach(ch=>{
    const id=ch.doc.id, key=kind+":"+id;
    if(ch.type==="removed"){ map.delete(id); if(Cloud.ready) Cloud.last.delete(key); ext=true; return; }
    const d=ch.doc.data({serverTimestamps:"estimate"}), pv=map.get(id);
    if(kind==="p" && Cloud.ready){
      if(d.rvState && (!pv || pv.rvState!==d.rvState) && d.rvBy && d.rvBy!==Cloud.user.email){
        const nm=d.rvByName||d.rvBy, t={pending:" שלח לאישור: ", approved:" אישר: ", returned:" החזיר לתיקון: "}[d.rvState];
        if(t) rvMsg=nm+t+pname(cloudObj(d.d)||{});
      }
    }
    map.set(id, d);
    if(Cloud.ready) Cloud.last.set(key, cloudLastOf(key,d));
    /* "עודכן ע״י" רק כשהתוכן עצמו השתנה — לא על שינוי סטטוס או חותמת זמן בלבד */
    if(!ch.doc.metadata.hasPendingWrites){
      ext=true;
      if(d.ub && d.ub!==Cloud.user.email && (!pv || JSON.stringify(cloudLastOf(key,pv))!==JSON.stringify(cloudLastOf(key,d)))) who=d.un||d.ub;
    }
  });
  cloudGot(kind, ext, who);
  if(rvMsg) cloudToast(rvMsg);
}
function cloudSnapDoc(kind, s){
  const key = kind==="s" ? "s:main" : "s:pricing";
  Cloud.snapPend[kind]=s.metadata.hasPendingWrites;
  /* מסמך הגדרות שנוצר עכשיו אצל מנהל אחר ולא היה ידוע כאן — מאמצים אותו כמו שהוא.
     (אחרת ההשוואה רואה את ברירות המחדל המקומיות כ"חדשות", ויוצרת אותו מחדש מעל השינוי של המנהל השני) */
  const fresh = Cloud.ready && s.exists() && !Cloud.last.has(key) && !s.metadata.hasPendingWrites;
  if(Cloud.ready && !fresh) cloudPush();
  let ext=false, who="";
  if(s.exists()){
    const d=s.data({serverTimestamps:"estimate"});
    if(kind==="s") Cloud.settings=d; else Cloud.pricing=d;
    if(Cloud.ready) Cloud.last.set(key, cloudLastOf(key,d));
    if(!s.metadata.hasPendingWrites){ ext=true; if(d.ub && d.ub!==Cloud.user.email) who=d.un||d.ub; }
  } else { if(kind==="s") Cloud.settings=null; else Cloud.pricing=null; if(Cloud.ready) Cloud.last.delete(key); }
  cloudGot(kind, ext, who);
}
function cloudSnapProd(s){
  let ext=false, who="";
  s.docChanges().forEach(ch=>{
    if(ch.type==="removed"){ Cloud.production.delete(ch.doc.id); ext=true; return; }
    const d=ch.doc.data({serverTimestamps:"estimate"});
    Cloud.production.set(ch.doc.id, d);
    if(!ch.doc.metadata.hasPendingWrites){ ext=true; if(d.sentBy && d.sentBy!==Cloud.user.email) who=d.sentByName||d.sentBy; }
  });
  cloudGot("x", ext, who);
}
function cloudSnapMe(s){
  if(!Cloud.user || s.metadata.hasPendingWrites) return;   /* תפקיד משתנה רק לפי מה שהשרת אישר, לא לפי ניסיון כתיבה מקומי */
  if(!s.exists()){ cloudLost(); return; }
  const md=s.data(), role=String(md.role||"");
  if(Cloud.user.phone){
    if(md.dev!==Cloud.user.uid){ cloudLost(); return; }
    if(md.name) Cloud.user.name=String(md.name).slice(0,60);
  }
  if(!ROLES[role]){ cloudLost(); return; }
  if(Cloud.role && role!==Cloud.role){
    /* התפקיד שונה ע"י מנהל — מתחילים מחדש עם ההרשאות החדשות */
    Cloud.role=role; cloudSetFlag({role:role}); cloudToast("התפקיד שלך עודכן: "+ROLES[role]);
    if(role==="maker"){ cloudStart(); return; }
    if(!cloudFlag().migrated) cloudSetFlag({migrated:true});
    cloudStart(); return;
  }
  Cloud.role=role;
  cloudGot("me", false, "");
}
function cloudLost(){ trackStop(); tmapStop(); cloudStop(); cloudTeamStop(); cloudActivityStop(); Cloud.ready=false; Cloud.role=""; cloudSetFlag({member:false, role:""}); cloudSetState("denied"); }
function cloudListenErr(e){
  if(e && e.code==="permission-denied") cloudLost();
  else { Cloud.err=cloudErrText(e); cloudSetState("error"); }
}
function cloudGot(kind, ext, who){
  Cloud.got[kind]=true;
  if(!Cloud.ready){ cloudMaybeReady(); cloudPill(); return; }
  cloudRebuild();
  if(ext) cloudRemoteChanged(who);
  cloudPill();
}

/* כל המאזינים החזירו מצב ראשון — מעלים שינויים שנעשו לפני כן, ומכאן הענן הוא מקור האמת */
function cloudMaybeReady(){
  if(Cloud.ready || !Cloud.need.every(k=>Cloud.got[k])) return;
  Cloud.ready=true;
  cloudPush();
  Cloud.last=new Map();
  Cloud.projects.forEach((d,id)=>Cloud.last.set("p:"+id, cloudLastOf("p:",d)));
  Cloud.items.forEach((d,id)=>Cloud.last.set("i:"+id, cloudLastOf("i:",d)));
  Cloud.prices.forEach((d,id)=>Cloud.last.set("r:"+id, cloudLastOf("r:",d)));
  if(Cloud.settings) Cloud.last.set("s:main", cloudLastOf("s:main",Cloud.settings));
  if(Cloud.pricing) Cloud.last.set("s:pricing", cloudLastOf("s:pricing",Cloud.pricing));
  if(cloudIsBoss()) cloudPurge();
  cloudRebuild();
  cloudSetState("ready");
  trackTick();
}

/* ---- דחיפה: השוואת DB למצב הידוע, וכתיבה רק של מה שהשתנה ---- */
function cloudPush(){
  if(!Cloud.ready || Cloud.role==="maker") return;
  const cur=cloudLocalMap(), dels=[];
  Cloud.last.forEach((old,key)=>{ if(!old.del && !cur.has(key) && (key[0]==="p" || key[0]==="i")) dels.push(key); });
  cur.forEach((v,key)=>{
    const old=Cloud.last.get(key);
    if(!old){ cloudWrite(key,"create",v); return; }
    const ch={}; let n=0;
    for(const f in v){ if(v[f]!==old[f]){ ch[f]=v[f]; n++; } }
    if(old.del) cloudWrite(key,"restore",ch);
    else if(n) cloudWrite(key,"update",ch);
  });
  dels.forEach(key=>{
    /* פריט נמחק רק אם הפרויקט שלו קיים כאן — פריטים של פרויקט שבסל המחזור נשארים צמודים אליו */
    if(key[0]==="i"){ const old=Cloud.last.get(key); if(!old || !cur.has("p:"+old.pid)) return; }
    cloudWrite(key,"delete",{});
  });
}
function cloudWrite(key, op, data, quiet){
  const M=Cloud.m, u=Cloud.user, ts=M.serverTimestamp(), now=Date.now();
  let payload;
  if(op==="delete") payload={ub:u.email, un:u.name, ua:ts, deleted:true, deletedAt:ts, deletedBy:u.email, deletedByName:u.name};
  else {
    payload=Object.assign({}, data, {ub:u.email, un:u.name, ua:ts, deleted:false});
    if(op==="create") Object.assign(payload, {cb:u.email, cn:u.name, ca:ts});
    if(op==="restore") Object.assign(payload, {deletedAt:M.deleteField(), deletedBy:M.deleteField(), deletedByName:M.deleteField()});
  }
  Cloud.pending++; cloudPill();
  M.setDoc(cloudRef(key), payload, {merge:true})
    .catch(e=>cloudWriteErr(e))
    .finally(()=>{ Cloud.pending=Math.max(0,Cloud.pending-1); cloudPill(); });
  /* עדכון אופטימי — הענן יחזיר בדיוק את אותו מצב, אז לא מחכים לו */
  const map=cloudMapOf(key), id=key.slice(2);
  const prev = map ? (map.get(id)||{}) : ((key==="s:main" ? Cloud.settings : Cloud.pricing)||{});
  const next = Object.assign({}, prev);
  if(op!=="delete") Object.assign(next, data);
  Object.assign(next, {ub:u.email, un:u.name, ua:now});
  if(op==="create") Object.assign(next, {cb:u.email, cn:u.name, ca:now});
  if(op==="delete") Object.assign(next, {deleted:true, deletedAt:now, deletedBy:u.email, deletedByName:u.name});
  else { next.deleted=false; if(op==="restore"){ delete next.deletedAt; delete next.deletedBy; delete next.deletedByName; } }
  if(map) map.set(id,next); else if(key==="s:main") Cloud.settings=next; else Cloud.pricing=next;
  Cloud.last.set(key, cloudLastOf(key,next));
  if(!quiet) cloudActivity(key, op, data);
}
/* כתיבה שנדחתה לא אומרת שהמשתמש הוסר מהצוות — את זה מזהה המאזין למסמך החבר */
function cloudWriteErr(e){ cloudToast("שמירה לענן נכשלה: "+cloudErrText(e)); }

/* ---- בנייה מחדש של DB מתוך מצב הענן ---- */
function cloudRebuild(){
  if(Cloud.role==="maker") return;          /* ליצרן אין פרויקטים — רק הזמנות ייצור */
  const boss=cloudIsBoss(), projs=[], byId=new Map(), ovs=new Map();
  Cloud.projects.forEach((d,id)=>{
    if(d.deleted || !cloudIdOk(id)) return;
    const p=cloudObj(d.d); if(!p) return;
    p.id=id; p.items=[]; if(!p.kind) p.kind="production"; p._m=cloudMeta(d); p._rv=cloudRv(d);
    if(boss){
      const r=Cloud.prices.get(id);
      if(r && r.d){ try{ const o=cloudObj(r.d)||{}; PRICE_P.forEach(k=>{ if(o[k]!==undefined) p[k]=o[k]; }); if(o.items) ovs.set(id,o.items); }catch(e){} }
    }
    projs.push(p); byId.set(id,p);
  });
  const its=[];
  Cloud.items.forEach((d,id)=>{
    if(d.deleted || !cloudIdOk(id)) return;
    const p=byId.get(d.pid); if(!p) return;
    const it=cloudObj(d.d); if(!it) return;
    it.id=id; it.photo=cloudImgOk(d.photo)?d.photo:null; it._m=cloudMeta(d);
    const ov=ovs.get(d.pid); if(ov && ov[id]!==undefined) it.priceOverride=ov[id];
    its.push({p:p, it:it, pos:Number(d.pos)||0, c:cloudCreated(id)});
  });
  its.sort((a,b)=>a.pos-b.pos || a.c-b.c).forEach(x=>x.p.items.push(x.it));
  projs.sort((a,b)=>cloudCreated(b.id)-cloudCreated(a.id));
  DB.projects=projs;
  if(Cloud.settings && Cloud.settings.d){
    try{
      const s=cloudObj(Cloud.settings.d)||{};
      s.logo=cloudImgOk(Cloud.settings.logo)?Cloud.settings.logo:null;
      if(boss && Cloud.pricing && Cloud.pricing.d){ const q=cloudObj(Cloud.pricing.d)||{}; PRICE_S.forEach(k=>{ if(q[k]!==undefined) s[k]=q[k]; }); }
      if(s.vatRate==null) s.vatRate=18;
      DB.settings=s;
    }catch(e){}
  }
  saveLocal();
}

/* ---- מחיקה סופית של מה שבסל המחזור יותר מ-TRASH_DAYS (רק מנהל/מפתח) ---- */
function cloudPurge(){
  const M=Cloud.m, lim=Date.now()-TRASH_DAYS*864e5;
  const old=d=>d.deleted && cloudMs(d.deletedAt) && cloudMs(d.deletedAt)<lim;
  Cloud.projects.forEach((d,id)=>{
    if(!old(d)) return;
    Cloud.items.forEach((di,iid)=>{ if(di.pid===id) M.deleteDoc(cloudRef("i:"+iid)).catch(()=>{}); });
    M.deleteDoc(cloudRef("p:"+id)).catch(()=>{});
  });
  Cloud.items.forEach((d,id)=>{ if(old(d)) M.deleteDoc(cloudRef("i:"+id)).catch(()=>{}); });
}

/* ---- שליחה לייצור: עותק קבוע של קובץ היצרן (בלי מחירים ובלי פרטי לקוח).
   התמונות מהשטח נשלחות במסמכים נפרדים (production/{pid}/photos/{iid}); כאן רק "טביעה" שלהן — כך החלפת תמונה מסמנת שיש גרסה חדשה ---- */
const prodPhKey = s => String(s).length+":"+String(s).slice(-24);
function prodSnapshot(p){
  const P={id:p.id, kind:p.kind||"production", address:p.address||"", name:p.name||"", date:p.date||""};
  const items=(p.items||[]).map(it=>{ const o=cloudOmit(it, ["photo","_m","priceOverride"]); if(it.photo) o.ph=prodPhKey(it.photo); return o; });
  return JSON.stringify({project:P, items:items});
}
/* התמונות מהשטח ליצרן: מסמך לכל פריט עם תמונה; תמונות שהוסרו מאז השליחה הקודמת — נמחקות */
function cloudSendPhotos(pid, p, ver){
  const M=Cloud.m, col=M.collection(Cloud.db,"teams",TEAM_ID,"production",pid,"photos"), keep=new Set();
  (p.items||[]).forEach(it=>{
    if(!it.photo || !cloudImgOk(it.photo) || !cloudIdOk(it.id)) return;
    keep.add(it.id);
    M.setDoc(M.doc(col, it.id), {photo:it.photo, ver:ver}).catch(e=>cloudToast("שליחת תמונה נכשלה: "+cloudErrText(e)));
  });
  M.getDocs(col).then(s=>s.forEach(d=>{ if(!keep.has(d.id)) M.deleteDoc(d.ref).catch(()=>{}); })).catch(()=>{});
}
function cloudDelPhotos(pid){
  const M=Cloud.m;
  M.getDocs(M.collection(Cloud.db,"teams",TEAM_ID,"production",pid,"photos"))
    .then(s=>s.forEach(d=>M.deleteDoc(d.ref).catch(()=>{}))).catch(()=>{});
}
/* אצל היצרן: התמונות של ההזמנה הפתוחה — נטענות רק כשפותחים אותה (חוסך תעבורה), ומתעדכנות לבד */
function cloudProdPhotos(pid){
  if(Cloud.prodPh && Cloud.prodPh.pid===pid) return Cloud.prodPh.map;
  cloudProdPhotosStop();
  const M=Cloud.m, ph={pid:pid, map:new Map(), unsub:null};
  Cloud.prodPh=ph;
  ph.unsub=M.onSnapshot(M.collection(Cloud.db,"teams",TEAM_ID,"production",pid,"photos"), s=>{
    const m=new Map();
    s.forEach(d=>{ const x=d.data(); if(cloudIdOk(d.id) && cloudImgOk(x.photo)) m.set(d.id, x.photo); });
    const same=m.size===ph.map.size && [...m].every(([k,v])=>ph.map.get(k)===v);
    ph.map=m;
    if(!same && Cloud.prodPh===ph && location.hash.replace(/^#\/?/,"").split("/")[0]==="prod") cloudRender();
  }, ()=>{});
  return ph.map;
}
function cloudProdPhotosStop(){ if(Cloud.prodPh && Cloud.prodPh.unsub){ try{ Cloud.prodPh.unsub(); }catch(e){} } Cloud.prodPh=null; }
function prodState(p){
  const s=Cloud.ready && Cloud.production.get(p.id);
  if(!s) return null;
  return {doc:s, changed: s.d!==prodSnapshot(p)};
}
function cloudSendProd(pid){
  const p=proj(pid); if(!p || !canBoss()) return;
  const miss=p.items.filter(it=>missingList(it).length).length;
  if(!p.items.length || miss){ uiAlert(miss?"חסרים נתונים ב-"+miss+" פריטים. משלימים אותם, ואז אפשר לשלוח ליצרן.":"אין פריטים בפרויקט.","אי אפשר לשלוח"); return; }
  const prev=Cloud.production.get(pid), pending=p._rv && p._rv.state==="pending";
  uiConfirm(pending ? "לאשר את המדידות של "+(p._rv.byName||"העובד")+" ולשלוח ליצרן? מהרגע הזה היצרן יראה את קובץ הייצור עם התמונות מהשטח — בלי מחירים ובלי פרטי לקוח."
          : prev ? "לשלוח ליצרן את הגרסה המעודכנת? היצרן יראה אותה במקום הקודמת."
                 : "לשלוח את הפרויקט ליצרן? מהרגע הזה הוא יראה את קובץ הייצור עם התמונות מהשטח — בלי מחירים ובלי פרטי לקוח.",
            {title:pending?"אישור ושליחה לייצור":"שליחה לייצור", ok:pending?"אשר ושלח ליצרן":prev?"שלח עדכון":"שלח ליצרן"}).then(ok=>{
    if(!ok) return;
    const M=Cloud.m, u=Cloud.user, ver=prev?(Number(prev.ver)||1)+1:1, snap=prodSnapshot(p);
    M.setDoc(M.doc(cloudCol("production"), pid), {d:snap, sentAt:M.serverTimestamp(), sentBy:u.email, sentByName:u.name, ver:ver})
      .catch(e=>uiAlert(cloudErrText(e),"השליחה נכשלה"));
    cloudSendPhotos(pid, p, ver);
    Cloud.production.set(pid, {d:snap, sentAt:Date.now(), sentBy:u.email, sentByName:u.name, ver:ver});
    if(p._rv && p._rv.state!=="approved") cloudReview(pid, "approved", "");
    cloudLogOnce(pending?"אישר ושלח ליצרן":prev?"שלח ליצרן גרסה מעודכנת ("+ver+")":"שלח ליצרן", pname(p), pid);
    cloudRender(); cloudToast(prev?"העדכון נשלח ליצרן ✓":"נשלח ליצרן ✓");
  });
}

/* ---- תהליך אישור: עובד ← מנהל ← יצרן ----
   rvState: pending (נשלח לאישור) · returned (הוחזר לתיקון, עם הערה) · approved (אושר).
   עובד יכול רק "לשלוח לאישור"; אישור והחזרה — רק מנהל/מפתח (נאכף בשרת). */
const cloudRv = d => (typeof d.rvState==="string" && ["draft","pending","approved","returned"].indexOf(d.rvState)>=0)
  ? {state:d.rvState, by:String(d.rvBy||""), byName:String(d.rvByName||""), at:cloudMs(d.rvAt), note:String(d.rvNote||"")} : null;
/* קובץ ליצוא / העתקה לייצור — רק מנהל ומפתח: הם היחידים מול היצרן */
function canExport(){ return !cloudActiveHere() || cloudIsBoss(); }
function cloudReview(pid, state, note){
  const M=Cloud.m, u=Cloud.user, ts=M.serverTimestamp(), now=Date.now();
  const data={rvState:state, rvBy:u.email, rvByName:u.name, rvAt:ts, rvNote:String(note||"").slice(0,500), ub:u.email, un:u.name, ua:ts, deleted:false};
  M.setDoc(cloudRef("p:"+pid), data, {merge:true}).catch(e=>uiAlert(cloudErrText(e),"הפעולה נכשלה"));
  const prev=Cloud.projects.get(pid)||{};
  Cloud.projects.set(pid, Object.assign({}, prev, data, {rvAt:now, ua:now}));
  cloudRebuild(); cloudRender();
}
function cloudSubmitReview(pid){
  const p=proj(pid); if(!p || !Cloud.ready) return;
  const miss=p.items.filter(it=>missingList(it).length).length;
  if(!p.items.length){ uiAlert("אין פריטים במדידה.","שליחה לאישור"); return; }
  if(miss){ uiAlert("חסרים נתונים ב-"+miss+" פריטים. משלימים אותם, ואז שולחים לאישור.","שליחה לאישור"); return; }
  const q=p.kind==="quote";
  uiConfirm("לשלוח את "+(q?"מדידת ההצעה":"הפרויקט")+" לאישור מנהל? המנהל יקבל הודעה, יבדוק"+(q?" ויאשר.":", ויאשר וישלח לייצור."),
            {title:"שליחה לאישור", ok:"שלח לאישור"}).then(ok=>{
    if(!ok) return;
    cloudReview(pid, "pending", "");
    cloudLogOnce("שלח לאישור מנהל", pname(p), pid);
    cloudToast("נשלח לאישור ✓");
  });
}
function cloudApprove(pid){
  const p=proj(pid); if(!p || !canBoss()) return;
  if(p.kind!=="quote"){ cloudSendProd(pid); return; }      /* פרויקט ייצור: אישור = שליחה ליצרן */
  uiConfirm("לאשר את מדידת ההצעה?",{title:"אישור", ok:"אשר"}).then(ok=>{
    if(!ok) return;
    cloudReview(pid, "approved", "");
    cloudLogOnce("אישר את מדידת ההצעה", pname(p), pid);
    cloudToast("אושר ✓");
  });
}
function cloudReturn(pid){
  const p=proj(pid); if(!p || !canBoss()) return;
  uiPrompt({title:"החזרה לתיקון", msg:"מה צריך לתקן? ההערה תוצג לעובד.", placeholder:"למשל: חסרה מידת הקבוע בחדר שינה", ok:"החזר לעובד"}).then(note=>{
    if(note===null) return;
    const n=String(note).trim();
    cloudReview(pid, "returned", n);
    cloudLogOnce("החזיר לתיקון"+(n?": "+n.slice(0,120):""), pname(p), pid);
    cloudToast("הוחזר לתיקון ✓");
  });
}
/* תיבת שיח עם שדה טקסט (כמו uiDialog) */
function uiPrompt(o){
  return new Promise(res=>{
    const ov=document.createElement("div"); ov.className="modal-overlay";
    ov.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+(o.title?'<h3>'+esc(o.title)+'</h3>':'')
      +'<div class="msg">'+esc(o.msg||"")+'</div>'
      +'<textarea rows="3" maxlength="500" style="width:100%;margin:-8px 0 16px" placeholder="'+esc(o.placeholder||"")+'"></textarea>'
      +'<div class="btns"><button class="btn primary" data-m="ok">'+esc(o.ok||"אישור")+'</button><button class="btn" data-m="cancel">ביטול</button></div></div>';
    document.body.appendChild(ov);
    const ta=ov.querySelector("textarea");
    const close=v=>{ ov.remove(); res(v); };
    ov.querySelector('[data-m="ok"]').onclick=()=>close(ta.value);
    ov.querySelector('[data-m="cancel"]').onclick=()=>close(null);
    ov.addEventListener("click",e=>{ if(e.target===ov) close(null); });
    ta.focus();
  });
}
/* תמונה מהשטח בגדול — לחיצה על התמונה בקובץ */
function photoZoom(el){
  if(!el || !el.src) return;
  const old=document.querySelector(".hview"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="hview no-print";
  ov.innerHTML='<div class="hview-card"><button class="hview-x" aria-label="סגירה">✕</button><img alt="תמונה מהשטח"></div>';
  ov.querySelector("img").src=el.src;
  ov.addEventListener("click", ()=>ov.remove());
  document.body.appendChild(ov);
}
/* תיבת שיח עם שדה קלט בשורה אחת (מספר טלפון) */
function uiAsk(o){
  return new Promise(res=>{
    const ov=document.createElement("div"); ov.className="modal-overlay";
    const tel=o.type==="tel";
    ov.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+(o.title?'<h3>'+esc(o.title)+'</h3>':'')
      +'<div class="msg">'+esc(o.msg||"")+'</div>'
      +(o.note?'<div class="msg" style="margin-top:-10px;font-weight:700">'+esc(o.note)+'</div>':'')
      +'<input type="'+(tel?'tel':'text')+'"'+(tel?' inputmode="tel" dir="ltr" autocomplete="tel"':'')+' maxlength="40" style="width:100%;margin:-8px 0 16px" placeholder="'+esc(o.placeholder||"")+'">'
      +'<div class="btns"><button class="btn primary" data-m="ok">'+esc(o.ok||"אישור")+'</button><button class="btn" data-m="cancel">ביטול</button></div></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector("input");
    const close=v=>{ ov.remove(); res(v); };
    ov.querySelector('[data-m="ok"]').onclick=()=>close(inp.value);
    ov.querySelector('[data-m="cancel"]').onclick=()=>close(null);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") close(inp.value); else if(e.key==="Escape") close(null); });
    ov.addEventListener("click",e=>{ if(e.target===ov) close(null); });
    inp.focus();
  });
}
/* כרטיס הסטטוס בדף הפרויקט */
function cloudReviewCard(p){
  if(!Cloud.ready || Cloud.role==="maker") return "";
  const rv=p._rv, boss=cloudIsBoss(), q=p.kind==="quote";
  const by=rv?esc(rv.byName||rv.by||""):"", when=rv?esc(cloudRel(rv.at)):"";
  const btn=(lbl,fn,cls)=>'<button class="btn small '+(cls||"")+'" onclick="'+fn+'(\''+esc(p.id)+'\')">'+lbl+'</button>';
  const note=rv&&rv.note?'<div class="rv-note" data-tr>'+esc(rv.note)+'</div>':'';
  if(!boss){
    if(!rv || rv.state==="draft") return p.items.length
      ? '<div class="card rv-card"><div class="rowline wrap"><div class="grow">כשהמדידה מוכנה — שולחים אותה לאישור מנהל.</div>'+btn("📤 שלח לאישור מנהל","cloudSubmitReview","primary")+'</div></div>' : "";
    if(rv.state==="pending") return '<div class="card rv-card rv-pending"><b>⏳ נשלח לאישור</b> · '+when+' · ממתין למנהל</div>';
    if(rv.state==="returned") return '<div class="card rv-card rv-returned"><b>↩ הוחזר לתיקון</b> ע״י '+by+' · '+when+note
      +'<div class="rowline wrap" style="margin-top:10px">'+btn("📤 תיקנתי — שלח שוב לאישור","cloudSubmitReview","primary")+'</div></div>';
    return '<div class="card rv-card rv-ok"><b>✓ אושר</b> ע״י '+by+' · '+when+'</div>';
  }
  if(!rv) return "";
  if(rv.state==="pending") return '<div class="card rv-card rv-pending"><b>⏳ '+by+' שלח לאישור</b> · '+when
    +'<div class="rowline wrap" style="margin-top:10px">'+btn(q?"✓ אשר":"✓ אשר ושלח ליצרן","cloudApprove","primary")+btn("↩ החזר לתיקון","cloudReturn")+'</div></div>';
  if(rv.state==="returned") return '<div class="card rv-card rv-returned"><b>↩ הוחזר לתיקון</b> ע״י '+by+' · '+when+note+'</div>';
  if(rv.state==="approved") return '<div class="card rv-card rv-ok"><b>✓ אושר</b> ע״י '+by+' · '+when+'</div>';
  return "";
}
/* מסך הבית: למנהל — ממתינים לאישור; לעובד — מה שהוחזר לתיקון */
function cloudQueueCard(){
  if(!Cloud.ready || Cloud.role==="maker") return "";
  const boss=cloudIsBoss(), want=boss?"pending":"returned";
  const rows=DB.projects.filter(p=>p._rv && p._rv.state===want).sort((a,b)=>b._rv.at-a._rv.at);
  if(!rows.length) return "";
  return '<div class="card rv-card '+(boss?'rv-pending':'rv-returned')+'"><b>'+(boss?"📥 ממתינים לאישור":"↩ הוחזרו לתיקון")+' (<span class="num">'+rows.length+'</span>)</b>'
    +rows.slice(0,8).map(p=>'<div class="rv-row" onclick="nav(\'/p/'+esc(p.id)+'\')"><span class="grow">'+(p.kind==="quote"?"💰 ":"🏠 ")+esc(pname(p))+'</span>'
      +'<span class="muted">'+esc(p._rv.byName||"")+' · '+esc(cloudRel(p._rv.at))+'</span></div>').join("")
    +'</div>';
}
function cloudUnsendProd(pid){
  const p=proj(pid); if(!p || !canBoss()) return;
  uiConfirm("לבטל את השליחה ליצרן? הפרויקט ייעלם אצלו עד שתשלח שוב.",{title:"ביטול שליחה",ok:"בטל שליחה",danger:true}).then(ok=>{
    if(!ok) return;
    const M=Cloud.m;
    M.deleteDoc(M.doc(cloudCol("production"), pid)).catch(e=>uiAlert(cloudErrText(e),"הביטול נכשל"));
    cloudDelPhotos(pid);
    Cloud.production.delete(pid);
    cloudLogOnce("ביטל את השליחה ליצרן", pname(p), pid);
    cloudRender();
  });
}
